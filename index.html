<style>
:root{
  --bg:#f3f4f2; --card:#ffffff; --fg:#1b2127; --muted:#5d6872; --line:#d9ddd8;
  --accent:#d9650b; --accent-fg:#ffffff;
  --ok:#1f8a4c; --ok-bg:#e3f4ea; --warn:#a86400; --warn-bg:#fff1d6; --bad:#c0262d; --bad-bg:#fde4e4;
  --info-bg:#e9eef3; --top:#1f2a33; --top-fg:#f3f4f2;
  --t-action:#2f6fb5; --t-controle:#7a3fb0; --t-valeur:#0f8a85; --t-avertissement:#b86a00;
  --t-minuterie:#3d4fb8; --t-checklist:#4a5866; --t-info:#6b7580;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12171b; --card:#1c2328; --fg:#eef1ef; --muted:#9aa6af; --line:#2f3a42;
    --accent:#f08a2c; --accent-fg:#1b1206;
    --ok:#4cc583; --ok-bg:#163526; --warn:#f2b44a; --warn-bg:#3a2b10; --bad:#ff6b70; --bad-bg:#3d1a1c;
    --info-bg:#232c33; --top:#0b0f12; --top-fg:#eef1ef;
    --t-action:#6aa7ec; --t-controle:#b585e6; --t-valeur:#3fc7c0; --t-avertissement:#f2b44a;
    --t-minuterie:#8a9bff; --t-checklist:#a5b2be; --t-info:#9aa6af;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--top);color:var(--top-fg);padding:10px 16px calc(10px);
  padding-top:calc(10px + env(safe-area-inset-top))}
header.top .row{display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:13px;opacity:.8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:10px;min-width:44px;height:40px;padding:0 10px}
.progress{height:6px;background:rgba(255,255,255,.18);border-radius:3px;margin-top:8px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);width:0}
#timers{display:flex;flex-direction:column;gap:6px;margin-top:8px}
#timers:empty{display:none}
.tchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:10px;padding:6px 10px;font-size:14px}
.tchip b{font-variant-numeric:tabular-nums;font-size:16px}
.tchip.due{background:var(--bad);color:#fff;animation:pulse 1s infinite}
.tchip .x{margin-left:auto;background:transparent;border:0;color:inherit;font-size:13px;text-decoration:underline;padding:4px}
@keyframes pulse{50%{opacity:.6}}
main{padding:16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h2{margin:0 0 6px;font-size:20px;line-height:1.25}
.card h3{margin:0 0 8px;font-size:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;color:#fff;background:var(--t-info)}
.b-action{background:var(--t-action)} .b-contrôle{background:var(--t-controle)} .b-valeur{background:var(--t-valeur)}
.b-avertissement{background:var(--t-avertissement)} .b-minuterie{background:var(--t-minuterie)} .b-checklist{background:var(--t-checklist)} .b-info{background:var(--t-info)}
.stepnum{font-weight:700;color:var(--muted);margin-right:6px}
.phasehead{font-size:14px;color:var(--muted);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px 12px}
.phasehead b{color:var(--fg)}
.text p{margin:8px 0}
.note{background:var(--info-bg);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.note.warn{background:var(--warn-bg);border-left:4px solid var(--warn)}
.note.bad{background:var(--bad-bg);border-left:4px solid var(--bad);font-weight:600}
.note.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
figure{margin:12px 0}
figure img{width:100%;border-radius:10px;display:block;background:var(--info-bg);cursor:zoom-in}
figure figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.imgmissing{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
.btn{display:block;width:100%;min-height:54px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:650;font-size:17px;padding:10px 14px;margin:8px 0;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.actionbar .inner{max-width:640px;margin:0 auto}
.actionbar .btn{margin:4px 0}
label.fld{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input.inp,textarea.inp{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;font-size:17px}
textarea.inp{min-height:70px;font-size:15px}
.valrow{display:flex;align-items:center;gap:10px}
.valrow input{font-size:26px;text-align:center;font-variant-numeric:tabular-nums}
.valrow .unit{font-size:20px;font-weight:600;min-width:40px}
.target{font-size:15px;margin-top:6px}
.check{display:flex;align-items:flex-start;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:26px;height:26px;flex:none;margin:0;accent-color:var(--ok)}
.countdown{font-size:48px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.list a,.list button.li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 2px;color:inherit;text-decoration:none;cursor:pointer}
.list .st{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none;border:2px solid var(--line)}
.st.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.st.forced{background:var(--warn);border-color:var(--warn);color:#fff}
.st.cur{border-color:var(--accent);color:var(--accent)}
details summary{cursor:pointer;font-weight:650;padding:6px 0}
.phase-sec{font-weight:700;margin:14px 0 2px;font-size:15px}
.log{font-size:14px}
.log .e{padding:8px 0;border-bottom:1px solid var(--line)}
.log .e .h{color:var(--muted);font-size:12px}
.tag{font-size:12px;font-weight:700;padding:1px 6px;border-radius:6px}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.forced{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom));background:var(--top);color:var(--top-fg);padding:10px 16px;border-radius:12px;z-index:50;max-width:90%;display:none;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:none;align-items:center;justify-content:center;padding:10px}
#zoom img{max-width:100%;max-height:100%;touch-action:pinch-zoom}
#menu{position:fixed;inset:0;z-index:40;display:none;background:rgba(0,0,0,.45)}
#menu.open{display:block}
#menu .sheet{position:absolute;top:0;left:0;bottom:0;width:min(86vw,340px);background:var(--card);padding:calc(16px + env(safe-area-inset-top)) 12px 16px;overflow-y:auto;box-shadow:4px 0 24px rgba(0,0,0,.3)}
#menu .sheet h3{margin:4px 8px 12px;font-size:16px}
#menu .mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:14px 10px;font-size:16px;cursor:pointer}
#menu .mi:active{background:var(--info-bg)}
#menu .mi.danger{color:var(--bad)}
#menu hr{border:0;border-top:1px solid var(--line);margin:8px 0}
#menu .ver{font-size:12px;color:var(--muted);margin:12px 10px 0}
.banner{background:var(--warn-bg);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
/* report */
.report table{width:100%;border-collapse:collapse;font-size:12px}
.report th,.report td{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:top}
@media print{
  .report div{overflow:visible!important}
  header.top,.actionbar,.noprint,#toast{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .card{border:0;padding:0}
  main{max-width:none}
}
</style>
</head>

# Phase : Logistique de transport jusqu'au chantier

## 1.1 Matériel à acheminer
Type: checklist
<!-- À COMPLÉTER : listing complet -->
- [ ] Container machine (sur Ampliroll) : pompe
- [ ] Container machine : trémie
- [ ] Container machine : imprimante
- [ ] Container machine : compresseur
- [ ] Container machine : box IHM, câbles
- [ ] Chariot élévateur frontal à fourches (2 t, hauteur sous fourche 5,5 m)
- [ ] Matériau (big bags)
- [ ] Groupe électrogène (20 kVA, sorties 16 A et 32 A)
- [ ] Tonne à eau (pas d'eau de pluie)
- [ ] Station totale
- [ ] 4 plaques sous patin
- [ ] Big bag + support pour purges de démarrage et de fin

## 1.2 Accessoires et outillage
Type: checklist
<!-- À COMPLÉTER : liste outillage -->
- [ ] Tuyau d'eau 25 m
- [ ] Masse
- [ ] Brosse de nettoyage
- [ ] EPI : casque à visière (ou casque + lunettes)
- [ ] EPI : gants
- [ ] EPI : chaussures de sécurité
Note: prévoir des outillages dédiés avec emplacements prévus.


# Phase : Cartographie
Rôle: topo

## 2.1 Définir le set de points de repérage
Type: action
À l'aide de la station totale, définir un set de points pour les repérages ultérieurs (multi-positionnements).

## 2.2 Identifier les positions de l'imprimante
Type: action
Identifier les différentes positions de l'imprimante.


# Phase : Implantation

## 3.1 Positionner l'imprimante
Type: action
Sortir l'imprimante du container et la positionner à son emplacement de travail (repère prédéfini).

## 3.2 Positionner pompe et trémie
Type: action
Sortir la pompe et la trémie du container et les positionner à proximité de l'imprimante.
Note: prévoir un accès protégé pour le chariot élévateur vers la trémie (chargement).

## 3.3 Positionner le groupe électrogène
Type: action

## 3.4 Positionner le big bag de purge
Type: action

## 3.5 Positionner l'IHM
Type: action
Choisir un emplacement avec vue sur la zone de travail.


# Phase : Réglage initial imprimante
Rôle: machine

## 4.1 Connecter l'imprimante
Type: action

## 4.2 Attendre le voyant orange clignotant
Type: contrôle
Le voyant orange clignote-t-il ?
Si non: ne pas poursuivre

## 4.3 Activer le déplacement
Type: action
Appuyer deux fois en haut à gauche de l'écran de contrôle.
Note: minimum 10 s entre les deux appuis.
<!-- À VÉRIFIER : les notes du 04/10 indiquaient 5 s entre appuis -->

## 4.4 Prépositionner les bras
Type: checklist
- [ ] Clavette de rotation sur bâti
- [ ] Clavette de bras
- [ ] Clavette de pied

## 4.5 Déployer les bras de l'imprimante
Type: action
Placer les plaques de répartition sous les patins.
![Plaques sous patin](images/station_05_plaques_patin.jpg)

## 4.6 Nivelage
Type: valeur
Plage: 0..13 cm
Si hors plage: repositionner la machine

## 4.7 Lever l'imprimante
Type: valeur
Chenilles à 48 cm du sol.
Plage: 48..48 cm

## 4.8 Mise à niveau de la machine
Type: contrôle
La machine est-elle de niveau ?
Si non: reprendre le réglage des patins


# Phase : Déploiement du bras
Rôle: machine
Durée: 15 min

## 5.1 Passer en mode crane
Type: action

## 5.2 Pousser le levier du milieu
Type: avertissement
Replier complètement le bras avant toute autre manœuvre.
![Levier du milieu](images/bras_02_levier_milieu.jpg)

## 5.3 Tirer le levier droit
Type: contrôle
Le bras décolle-t-il bien du patin ?
Si non: ARRÊT – ne pas poursuivre
![Levier droit](images/bras_03_levier_droit.jpg)

## 5.4 Monter à 45° minimum
Type: valeur
Plage: 45..90 °

## 5.5 Déplier
Type: action
Tirer le levier central.

## 5.6 Baisser l'ensemble
Type: action

## 5.7 Déclipser la tête
Type: action

## 5.8 Placer le tuyau
Type: action
Opérateurs: 2
Descendre la structure et placer le tuyau : un opérateur sur escabeau, un qui maintient le tuyau.

## 5.9 Rotation
Type: action
Rotation au levier rouge – toujours en dernier.

## 5.10 Éteindre le moteur
Type: action
<!-- À VÉRIFIER : dans l'ébauche, « Éteindre le moteur » précède la note sur la rotation ; ordre supposé ici : rotation puis arrêt moteur -->


# Phase : Configuration IHM
Rôle: IHM

## 6.1 Connecter l'IHM
Type: avertissement
Attention particulière au cordon de liaison.

## 6.2 Mode JIB – Boom
Type: valeur
Plage: 4995..5005

## 6.3 Mode JIB – JIB
Type: valeur
Plage: 3095..3105

## 6.4 Fermer les vannes et couper le moteur
Type: action
Fermer les 4 valves (1/4 de tour), puis couper le moteur.
<!-- À VÉRIFIER : les notes mentionnaient ensuite « Réactiver moteur » -->

## 6.5 Vérifier la verticalité de la tête
Type: contrôle
Offset moteur 4.
Si non: corriger l'offset


# Phase : Calage des points (Theodolite Positioning Assistant)
Rôle: topo
Durée: 20 min

## 7.1 Principe
Type: info
Le fichier source (CSV ou dxf) donne les coordonnées des points du plan. Il faut les caler avec les points relevés sur le terrain.

## 7.2 Choisir les points
Type: checklist
- [ ] Entre 3 et 10 points (5 en général)
- [ ] Points situés entre la machine et la zone d'impression
- [ ] Pas de figure symétrique
- [ ] 3 points connus + 2 points au hasard
- [ ] Au moins 3 m entre deux points

## 7.3 Relever le fichier Target
Type: avertissement
Digitalisation des points : ne pas changer d'altitude entre les mesures et ne pas modifier Z pendant une mesure.

## 7.4 Cohérence source / target
Type: contrôle
Le fichier source et le fichier target ont-ils le même nombre de points ? (1 point = 1 hauteur)
Si non: reprendre le relevé

## 7.5 Matérialiser les points
Type: checklist
- [ ] Sur bitume : clous de charpentier
- [ ] Sur béton : mires à coller (Leica) ou croix sur scotch
- [ ] 2 mires placées hors de portée (pas au sol)


# Phase : Air print
Rôle: IHM
Durée: 10 min

## 8.1 Transférer le G-code
Type: action
Upload du fichier.

## 8.2 Lancer l'Air print
Type: action
Activer le moteur, passer en mode Air print, puis lancer l'impression : positionnement, offset.

## 8.3 Surveillance
Type: avertissement
Approche lente – rester attentif aux collisions.

## 8.4 Tête sur big bag
Type: action
Positionner la tête sur le big bag pour la purge initiale.
<!-- À VÉRIFIER : 8.4 et 8.5 relèvent plutôt de la préparation impression que de l'Air print -->

## 8.5 Compresseur
Type: action
Connecter le compresseur à l'imprimante et le mettre en route.


# Phase : Préparation pompe
Rôle: pompe
Durée: 20 min

## 9.1 Montage
Type: action
Monter le malaxeur, puis la vis, puis la jaquette.
<!-- À VÉRIFIER : doublon partiel avec 13.2 à 13.4 (démarrage pompe) -->

## 9.2 Choisir la jaquette
Type: info
Violette (lilas) : petites pièces, petits mouvements, ~85 mm/s.
Verte : grandes pièces, grands mouvements, ~120 mm/s.
Note: le débit se règle en resserrant la jaquette (usure).

## 9.3 Vérifier les robinets de purge
Type: contrôle
Les robinets de purge sont-ils en bon état et en position ?
Si non: corriger avant de poursuivre


# Phase : Raccordement eau
Rôle: pompe

## 10.1 Brancher l'eau
Type: avertissement
Prise d'eau ou tonne à eau. Eau potable uniquement, pas d'eau de pluie. Compter ~150 L par tonne de matériau.

## 10.2 Test de pression réseau
Type: contrôle
Écran et débitmètre OK ?
Si non: vérifier l'alimentation en eau


# Phase : Préparation du tuyau
Rôle: pompe

## 11.1 Poser le tuyau
Type: action

## 11.2 Lubrifier le tuyau
Type: valeur
Barbotine.
Plage: 7..10 L


# Phase : Chargement trémie
Rôle: chariot
Opérateurs: 2

## 12.1 Amener le big bag
Type: action
Big bag avec chaussette, amené au chariot.

## 12.2 Ouvrir le big bag
Type: avertissement
2 personnes : une sur l'échelle, une sur le Fenwick. Dénouer la chaussette de préférence ; si cutter, il doit être attaché à l'utilisateur.

## 12.3 Joint de trémie
Type: contrôle
Après versement, le joint de trémie est-il toujours en place ?
Si non: ARRÊT – récupérer le joint avant de démarrer

## 12.4 Refermer le couvercle
Type: action


# Phase : Démarrage pompe
Rôle: pompe
Note: tête positionnée sur le big bag.

## 13.1 Enlever le bouchon
Type: action

## 13.2 Malaxeur horizontal
Type: action
Placer le malaxeur en position horizontale.

## 13.3 Vérifier la rotation de la vis
Type: contrôle
La vis tourne-t-elle librement en actionnant le malaxeur ?
Si non: ne pas démarrer

## 13.4 Placer jaquette et vis
Type: action
Placer la jaquette, puis la vis dans la jaquette (à fond).

## 13.5 Lancer la pompe
Type: action
Start pump, en contrôlant la viscosité.
Opérateurs: 2
Note: un opérateur à la pompe (écoulement), un à l'IHM (correction du débit).

## 13.6 Pression de pompage
Type: valeur
Plage: 7..9 bar
Si hors plage: corriger le débit à l'IHM

## 13.7 Remplissage
Type: minuterie
Durée: 8 min
Remplissage avec jaquette violette.
<!-- À VÉRIFIER : 350 l/min noté sur l'IHM – incohérent avec 5–15 l/min de la jaquette -->

## 13.8 Slug test
Type: valeur
Longueur de boudin visée 28 cm. Une fois atteinte, l'impression peut commencer.
Plage: 28..28 cm


# Phase : Contrôles pendant la marche
Type: info
<!-- Phase de référence consultable pendant l'impression, plus alertes périodiques -->

## 14.1 Écran
Type: checklist
- [ ] Débit (L/h)
- [ ] Voyant rouge
- [ ] Sonde laser OK

## 14.2 Manomètre et tuyau
Type: info
Contrôler le manomètre. Marcher sur le tuyau permet de vérifier s'il est vide ou plein.

## 14.3 Anomalies
Type: info
Moteur en zone rouge : pas assez ventilé.
Sonde humide déclenchée : bouchon ou laser encrassé.

<script>
"use strict";
/* ============================================================

/* ============================================================

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtT = ms => { const d=new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const fmtD = ms => { const d=new Date(ms); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };
const fmtDur = s => { s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h? `${h}:${pad(m)}:${pad(x)}` : `${pad(m)}:${pad(x)}`; };
const num = v => { const n=parseFloat(String(v).replace(',','.')); return isNaN(n)?null:n; };

/* ============================================================
   Parseur Markdown (conventions du fichier procédure)
   ============================================================ */
const TYPES = {action:'action', controle:'contrôle', valeur:'valeur', avertissement:'avertissement', minuterie:'minuterie', checklist:'checklist', info:'info'};
function parseDuree(v){
  const m = noAcc(v).match(/([\d.,]+)\s*(h|min|mn|m|s)?/); if(!m) return null;
  const n=num(m[1]); const u=m[2]||'min';
  return u==='h'? n*3600 : u==='s'? n : n*60;
}
/* Plage tolérante : « 7..9 bar », « de 0..13 cm », « 0 à 13 cm », « entre 7 et 9 bar », « 7-9 bar »,
   « 28 ±1 cm », « ≥ 45 ° », « 45° mini », « < 13 cm », « 13 cm max », « 48 cm » (valeur cible) */
function parsePlage(v){
  const N='(-?\\d+(?:[.,]\\d+)?)';
  let t=String(v).trim().replace(/^(?:de|entre|from|between)\s+/i,'');
  let m;
  if((m=t.match(new RegExp('^'+N+'\\s*(?:\\.\\.\\.?|à|a|et|-|–|—|to|/)\\s*'+N+'\\s*(.*)$','i'))))
    return {min:num(m[1]), max:num(m[2]), unit:m[3].trim()};
  if((m=t.match(new RegExp('^'+N+'\\s*(?:±|\\+/-|\\+-)\\s*'+N+'\\s*(.*)$'))))
    return {min:num(m[1])-num(m[2]), max:num(m[1])+num(m[2]), unit:m[3].trim()};
  if((m=t.match(new RegExp('^(?:<=?|≤|max(?:i(?:mum)?)?\\.?|inf[ée]rieur(?:e)?\\s+(?:ou\\s+[ée]gal(?:e)?\\s+)?[àa]|jusqu.[àa])\\s*'+N+'\\s*(.*)$','i'))))
    return {min:-Infinity, max:num(m[1]), unit:m[2].trim()};
  if((m=t.match(new RegExp('^(?:>=?|≥|min(?:i(?:mum)?)?\\.?|sup[ée]rieur(?:e)?\\s+(?:ou\\s+[ée]gal(?:e)?\\s+)?[àa]|au\\s+moins)\\s*'+N+'\\s*(.*)$','i'))))
    return {min:num(m[1]), max:Infinity, unit:m[2].trim()};
  if((m=t.match(new RegExp('^'+N+'\\s*(.*?)\\s*(mini?|minimum|maxi?|maximum)\\.?$','i')))){
    const isMin=/^min/i.test(m[3]);
    return isMin? {min:num(m[1]), max:Infinity, unit:m[2].trim()} : {min:-Infinity, max:num(m[1]), unit:m[2].trim()};
  }
  if((m=t.match(new RegExp('^'+N+'\\s*([^\\d]*)$'))))
    return {min:num(m[1]), max:num(m[1]), unit:m[2].trim()};
  return null;
}
function plageTxt(pl){
  const u=pl.unit? ' '+pl.unit : '';
  if(pl.min===-Infinity) return `≤ ${pl.max}${u}`;
  if(pl.max===Infinity) return `≥ ${pl.min}${u}`;
  if(pl.min===pl.max) return `${pl.min}${u}`;
  return `${pl.min} à ${pl.max}${u}`;
}
function parseMD(text){
  const warnings=[], meta={}, phases=[];
  let src = String(text||'').replace(/\r\n?/g,'\n');
  src = src.replace(/<!--[\s\S]*?-->/g, m=>m.replace(/[^\n]/g,''));   // retire commentaires, garde les n° de ligne
  const lines = src.split('\n');
  let i=0;
  if(lines[0] && lines[0].trim()==='---'){
    i=1;
    while(i<lines.length && lines[i].trim()!=='---'){
      const m=lines[i].match(/^\s*([^:]+?)\s*:\s*(.*)$/); if(m) meta[noAcc(m[1])]=m[2].trim(); i++;
    }
    i++;
  }
  let ph=null, st=null;
  for(; i<lines.length; i++){
    const raw=lines[i], ln=i+1, l=raw.trim();
    if(!l) continue;
    let m;
    if((m=raw.match(/^#\s+(.+)$/))){
      ph={name:m[1].replace(/^Phase\s*:\s*/i,'').trim(), line:ln, steps:[], text:[], notes:[]};
      phases.push(ph); st=null; continue;
    }
    if((m=raw.match(/^##\s+(.+)$/))){
      if(!ph){ warnings.push({line:ln,msg:'Étape avant toute phase'}); ph={name:'(sans phase)',line:ln,steps:[],text:[],notes:[]}; phases.push(ph); }
      const t=m[1].trim(); const mm=t.match(/^(\d+(?:\.\d+)*[a-z]?)\s+(.+)$/i);
      st={num:mm?mm[1]:'', title:mm?mm[2]:t, type:'action', typeSet:false, line:ln, text:[], notes:[], items:[], images:[]};
      ph.steps.push(st); continue;
    }
    if(/^#{3,}\s/.test(raw)){ warnings.push({line:ln,msg:'Titre ### non géré (utiliser # pour une phase, ## pour une étape)'}); continue; }
    if(!ph) continue;                       // texte libre avant la 1re phase : ignoré
    const tgt = st || ph;
    if((m=l.match(/^([A-Za-zÀ-ÿ ]+?)\s*:\s*(.*)$/))){
      const k=noAcc(m[1]), v=m[2].trim(); let used=true;
      switch(k){
        case 'type': {
          const t=TYPES[noAcc(v)];
          if(st){ if(t){ st.type=t; st.typeSet=true; } else warnings.push({line:ln,msg:`Type inconnu « ${v} »`}); }
          break; }
        case 'plage': {
          const pl=parsePlage(v);
          if(pl && st){ st.plage=pl; }
          else warnings.push({line:ln,msg:`Plage illisible « ${v} » (ex. : 7..9 bar, de 0 à 13 cm, 28 ±1 cm, ≥ 45 °, 13 cm max)`});
          break; }
        case 'duree': { const d=parseDuree(v); if(d===null) warnings.push({line:ln,msg:`Durée illisible « ${v} »`}); tgt.duree=d; tgt.dureeTxt=v; break; }
        case 'si non': tgt.siNon=v; break;
        case 'si hors plage': tgt.siHors=v; break;
        case 'operateurs': tgt.operateurs=v; break;
        case 'role': tgt.role=v; break;
        case 'note': tgt.notes.push(v); break;
        case 'commentaire': tgt.commentReq=/oblig/i.test(noAcc(v)); break;
        case 'repeter': tgt.repeat=/^(oui|yes|true|1)/i.test(noAcc(v)); break;
        default: used=false;
      }
      if(used) continue;
    }
    if((m=l.match(/^[-*]\s+\[[ xX]\]\s+(.+)$/))){ if(st) st.items.push(m[1]); else warnings.push({line:ln,msg:'Case à cocher hors étape'}); continue; }
    if((m=l.match(/^!\[([^\]]*)\]\(\s*([^)\s]+)\s*\)/))){ if(st) st.images.push({alt:m[1],src:m[2]}); else warnings.push({line:ln,msg:'Image hors étape'}); continue; }
    tgt.text.push(l.replace(/^[-*]\s+/,'• '));
  }
  phases.forEach(p=>p.steps.forEach(s=>{
    const lbl=`Étape ${s.num||s.title}`;
    if(!s.typeSet) warnings.push({line:s.line,msg:`${lbl} : pas de « Type: » (action par défaut)`});
    if(s.type==='valeur' && !s.plage) warnings.push({line:s.line,msg:`${lbl} : Type valeur sans Plage`});
    if(s.type==='minuterie' && !s.duree) warnings.push({line:s.line,msg:`${lbl} : minuterie sans Durée`});
    if(s.type==='checklist' && !s.items.length) warnings.push({line:s.line,msg:`${lbl} : checklist sans case « - [ ] »`});
  }));

  if(!flat.length) warnings.push({line:0,msg:'Aucune étape trouvée'});
  return {meta, phases, flat, warnings};
}

async function loadPublished(){
  const local = store.get(K.local);
  if(local && local.text){ return {text:local.text, source:`fichier local (${local.name||'.md'})`}; }
  let missing=false, offline=false;
  try{
    const r = await fetch(MD_URL, {cache:'no-cache'});
    if(r.ok){ return {text: await r.text(), source:'publiée'}; }
    missing = true;
  }catch(e){ offline=true; }
  const emb = $('#embedded-md').textContent;
  const why = missing? 'fichier MD introuvable sur le serveur' : 'hors ligne, fichier non encore en cache';
  if(emb && !emb.includes('/*EMBEDDED_MD*/')) return {text:emb, source:`copie intégrée (${why})`, missing, offline};
  return {text:'', source:'aucune', missing, offline};
}
async function init(){
  const pub = await loadPublished();

  if(CUR && !CUR.closedAt){ P = parseMD(CUR.mdText); } else { CUR=null; P = PUB.parsed; }
  const v = PUB.parsed.meta.version, last = store.get(K.lastVer);
  if(v && last && v!==last && pub.source==='publiée') toast(`Nouvelle procédure chargée : v${v}`, 4000);

function startIntervention(chantier, operateur){
  store.set(K.op, operateur);
  CUR = { id: Date.now().toString(36), chantier, operateur, startedAt: Date.now(),

function logEvt(f, status, label, value, comment){
  if(!CUR) return;
  CUR.log.push({ t:Date.now(), phase: f? f.phase.name : '', num: f? f.step.num : '', title: f? f.step.title : label,
    type: f? f.step.type : 'événement', status, value: value??'', unit: f&&f.step.plage? f.step.plage.unit : '', comment: comment||'' });
}
function record(f, status, value, comment){

}
function nextStep(){

}

/* ============================================================

function startTimer(f){
  ensureAudio(); askNotif();
  const s=f.step, dur=s.duree||60;
  CUR.timers = CUR.timers.filter(t=>t.key!==f.key);
  CUR.timers.push({key:f.key, label:`${s.num} ${s.title}`, dur, endAt: Date.now()+dur*1000, repeat: !!s.repeat, due:false});
  logEvt(f,'minuterie',s.title, s.dureeTxt||fmtDur(dur), s.repeat?'alerte périodique démarrée':'démarrée');
  save(); renderTimers();
}
function stopTimer(key){
  const t=CUR && CUR.timers.find(x=>x.key===key); if(!t) return;
  CUR.timers = CUR.timers.filter(x=>x.key!==key);
  logEvt(null,'minuterie',`Arrêt minuterie ${t.label}`,'',''); save(); renderTimers(); if(view==='step') render();
}
function ackTimer(key){
  const t=CUR.timers.find(x=>x.key===key); if(!t) return;
  if(t.repeat){ t.due=false; t.endAt=Date.now()+t.dur*1000; logEvt(null,'alerte',`Alerte acquittée : ${t.label}`,'',''); }
  else { t.due=false; t.acked=true; }
  save(); renderTimers();
}
function restoreTimers(){ renderTimers(); }
function tick(){
  if(!CUR || !CUR.timers || !CUR.timers.length) return;
  const now=Date.now(); let changed=false;
  CUR.timers.forEach(t=>{
    if(!t.due && !t.acked && now>=t.endAt){ t.due=true; changed=true; alarm(t.label, t.repeat? 'Alerte périodique' : 'Minuterie écoulée'); logEvt(null,'alerte',`Échéance : ${t.label}`,'',''); }
  });
  if(changed){ save(); if(view==='step') render(); }
  renderTimers();
  const cd=$('#cd'); if(cd){ const t=CUR.timers.find(x=>x.key===cd.dataset.key); if(t) cd.textContent = t.due||t.acked? '00:00' : fmtDur((t.endAt-now)/1000); }
}
function renderTimers(){
  const box=$('#timers'); if(!CUR || !CUR.timers.length){ box.innerHTML=''; return; }
  const now=Date.now();
  box.innerHTML = CUR.timers.filter(t=>!(t.acked && !t.repeat)).map(t=>`
    <div class="tchip ${t.due?'due':''}">⏱ <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.label)}</span>
      <b>${t.due?'ÉCHU':fmtDur((t.endAt-now)/1000)}</b>
      ${t.due? `<button class="x" data-ack="${t.key}">${t.repeat?'Fait, relancer':'OK'}</button>` : (t.repeat?`<button class="x" data-stop="${t.key}">Arrêter</button>`:'')}
    </div>`).join('');
}
function ensureAudio(){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){} }
function beep(){
  try{ ensureAudio(); if(!audioCtx) return; const t0=audioCtx.currentTime;
    for(let k=0;k<3;k++){ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='square'; o.frequency.value=880;
      g.gain.setValueAtTime(.0001,t0+k*.45); g.gain.exponentialRampToValueAtTime(.3,t0+k*.45+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+k*.45+.3);
      o.connect(g).connect(audioCtx.destination); o.start(t0+k*.45); o.stop(t0+k*.45+.32); } }catch(e){}
}
function askNotif(){ try{ if('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }catch(e){} }
async function alarm(label, title){
  beep(); try{ navigator.vibrate && navigator.vibrate([400,200,400,200,600]); }catch(e){}
  toast(`⏱ ${title} : ${label}`, 6000);
  try{
    if('Notification' in window && Notification.permission==='granted' && navigator.serviceWorker){
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg) reg.showNotification(title, {body:label, tag:'j3d-'+label, renotify:true, icon:'icons/icon-192.png', vibrate:[400,200,400]});
    }
  }catch(e){}
}

/* ---------- Écran d'étape ---------- */
function stepBody(f, ro){
  const s=f.step, p=f.phase, firstOfPhase = f.s===0;
  let h=`<div class="phasehead"><span><b>${esc(p.name)}</b></span>
    ${(s.role||p.role)?`<span>Rôle : <b>${esc(s.role||p.role)}</b></span>`:''}
    ${(s.operateurs||p.operateurs)?`<span>👥 <b>${esc(s.operateurs||p.operateurs)}</b></span>`:''}
    ${(firstOfPhase && p.dureeTxt)?`<span>⏱ phase ≈ <b>${esc(p.dureeTxt)}</b></span>`:''}</div>`;
  if(firstOfPhase){ p.text.forEach(t=>h+=`<div class="note small">${inl(t)}</div>`); p.notes.forEach(n=>h+=`<div class="note">${inl(n)}</div>`); }
  h+=`<div class="card"><div style="margin-bottom:8px"><span class="badge b-${s.type}">${esc(s.type)}</span></div>
    <h2><span class="stepnum">${esc(s.num)}</span>${inl(s.title)}</h2>
    <div class="text">${s.text.map(t=>`<p>${inl(t)}</p>`).join('')}</div>
    ${s.images.map(im=>`<figure><img src="${esc(im.src)}" alt="${esc(im.alt)}" loading="lazy" data-zoom>${im.alt?`<figcaption>${esc(im.alt)}</figcaption>`:''}</figure>`).join('')}
    ${s.notes.map(n=>`<div class="note warn">${inl(n)}</div>`).join('')}`;
  if(s.plage){
    const pl=s.plage, tgt = `${pl.min===pl.max?'Cible':'Plage'} : <b>${esc(plageTxt(pl))}</b>`;
    h+=`<div class="target">${tgt}</div>`;
  }
  // consignes conditionnelles affichées en information quand le type ne les déclenche pas
  if(s.siHors && s.type!=='valeur') h+=`<div class="note warn small">Si hors plage : ${inl(s.siHors)}</div>`;
  if(s.siNon && s.type!=='contrôle') h+=`<div class="note warn small">Si non : ${inl(s.siNon)}</div>`;
  if(s.type==='minuterie') h+=`<div class="target">Durée : <b>${esc(s.dureeTxt||fmtDur(s.duree||0))}</b>${s.repeat?' – alerte périodique':''}</div>`;
  if(s.type==='checklist' && ro) h+=`<div>${s.items.map(it=>`<div class="check"><span>☐</span><span>${inl(it)}</span></div>`).join('')}</div>`;
  h+=`</div>`;
  return h;
}
function renderStep(){
  if(!CUR){ go('home'); return; }
  const f=stepAt(CUR.pos); if(!f){ go('journal'); return; }
  const s=f.step, res=CUR.results[f.key];
  header(`${s.num} ${s.title}`, `${CUR.chantier} · étape ${CUR.pos+1}/${P.flat.length}`, (CUR.pos)/(P.flat.length));
  let h = stepBody(f,false);
  const u=uiState;
  if(res) h+=`<div class="note ${res.status==='ok'?'ok':'warn'} small">Déjà validée à ${fmtT(res.at)}${res.value!==''?` – valeur ${esc(res.value)}`:''}${res.comment?` – « ${esc(res.comment)} »`:''}. Vous pouvez la refaire.</div>`;

  // zones spécifiques au type
  if(s.type==='checklist'){
    u.checks = u.checks || (res && res.checks) || s.items.map(()=>false);
    h+=`<div class="card">${s.items.map((it,k)=>`<label class="check"><input type="checkbox" data-chk="${k}" ${u.checks[k]?'checked':''}><span>${inl(it)}</span></label>`).join('')}</div>`;
  }
  if(s.type==='valeur'){
    h+=`<div class="card"><label class="fld" for="fVal">Valeur mesurée</label>
      <div class="valrow"><input class="inp" id="fVal" inputmode="decimal" autocomplete="off" value="${esc(u.val??'')}"><span class="unit">${esc(s.plage?.unit||'')}</span></div></div>`;
  }
  if(s.type==='minuterie'){
    const t=CUR.timers.find(x=>x.key===f.key);
    if(t) h+=`<div class="card"><div class="countdown" id="cd" data-key="${f.key}">${t.due||t.acked?'00:00':fmtDur((t.endAt-Date.now())/1000)}</div>
      ${t.due?'<div class="note bad">Temps écoulé</div>':''}</div>`;
  }
  if(u.problem){
    h+=`<div class="note bad">${inl(u.problem)}</div>`;
  }
  if(u.needComment || s.type!=='info'){
    const req = u.needComment && s.commentReq;
    h+=`<label class="fld" for="fCom">${u.needComment? (req?'Commentaire (obligatoire)':'Commentaire sur l’anomalie (facultatif)') : 'Remarque (facultatif)'}</label>
      <textarea class="inp" id="fCom" placeholder="${u.needComment?'Décrire l’anomalie / la décision':'…'}">${esc(u.com??'')}</textarea>`;
  }
  $('#app').innerHTML=h;
  setBar(stepActions(f));
}
function stepActions(f){
  const s=f.step, u=uiState, prev = CUR.pos>0 ? `<button class="btn ghost" data-act="prev" style="flex:0 0 30%">‹ Préc.</button>` : '';
  let main='';
  if(u.forceMode){
    main=`<button class="btn bad" data-act="force">Consigner l’anomalie et continuer</button>`;
    return `<div class="btnrow">${prev}<button class="btn" data-act="retry">Corriger / refaire</button></div>${main}`;
  }
  switch(s.type){
    case 'action': main=`<button class="btn ok" data-act="done">✓ Fait</button>`; break;
    case 'info': main=`<button class="btn primary" data-act="done">Suivant ›</button>`; break;
    case 'avertissement': main=`<button class="btn primary" data-act="done">⚠ Lu et compris</button>`; break;
    case 'contrôle': return `<div class="btnrow">${prev}<button class="btn bad" data-act="no">✗ Non</button><button class="btn ok" data-act="yes">✓ Oui</button></div>`;
    case 'valeur': main=`<button class="btn primary" data-act="val">Valider la valeur</button>`; break;
    case 'checklist': {
      const all = (u.checks||[]).every(Boolean);
      main = all? `<button class="btn ok" data-act="chk">✓ Tout est coché</button>` : `<button class="btn" data-act="chkpart">Valider incomplet…</button>`;
      break; }
    case 'minuterie': {
      const t=CUR.timers.find(x=>x.key===f.key);
      if(!t) main=`<button class="btn primary" data-act="tstart">▶ Démarrer (${esc(s.dureeTxt||fmtDur(s.duree||0))})</button>`;
      else if(s.repeat) main=`<button class="btn ok" data-act="done">Continuer ›</button>`;
      else if(t.due||t.acked) main=`<button class="btn ok" data-act="tdone">✓ Terminé</button>`;
      else main= u.early? `<button class="btn bad" data-act="tdone">Confirmer validation anticipée</button>` : `<button class="btn" data-act="tearly">Valider avant la fin…</button>`;
      break; }
  }
  return `<div class="btnrow">${prev}${main}</div>`;
}

function closeMenu(){ $('#menu').classList.remove('open'); }
async function menuAction(el){
  const a=el.dataset.menu;
  if(a==='abandon' && !el.dataset.confirm){ el.dataset.confirm='1'; el.textContent='✖ Confirmer l’abandon (journal archivé)'; return; }
  if(a==='quit' && CUR && !el.dataset.confirm){ el.dataset.confirm='1'; el.textContent='⏻ Quitter (l’intervention reste enregistrée)'; return; }
  closeMenu(); viewedArchive=null;
  switch(a){
    case 'home': go('home'); break;
    case 'step': go('step'); break;
    case 'phases': go('phases'); break;
    case 'journal': go('journal'); break;
    case 'browse': view='browse'; uiState={}; render(); window.scrollTo(0,0); break;
    case 'abandon': logEvt(null,'abandon','Intervention abandonnée','',''); closeIntervention(); toast('Intervention abandonnée (archivée)'); go('home'); break;
    case 'reload':
      try{ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }catch(e){}
      try{ const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.update())); }catch(e){}
      location.reload(); break;
    case 'quit':
      releaseWake(); save();
      try{ window.close(); }catch(e){}
      setTimeout(()=>{ go('home'); toast('Fermer avec le bouton « Applications récentes » d’Android', 4000); }, 300);
      break;
  }
}

function csvOf(I){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const head=['Date','Heure','Phase','Étape','Intitulé','Type','Résultat','Valeur','Unité','Commentaire'];
  const lines=[`${q('Chantier')};${q(I.chantier)}`, `${q('Opérateur')};${q(I.operateur)}`, `${q('Procédure')};${q(I.procName+' v'+I.procVersion+' ('+I.procDate+')')}`, '', head.map(q).join(';')];
  I.log.forEach(e=>lines.push([fmtD(e.t),fmtT(e.t),e.phase,e.num,e.title,e.type,e.status,e.value,e.unit,e.comment].map(q).join(';')));
  return '﻿'+lines.join('\r\n');
}
async function exportCsv(I){
  const name=`journal_J3D_${(I.chantier||'chantier').replace(/[^\w-]+/g,'_')}_${fmtD(I.startedAt).replace(/\//g,'-')}.csv`;
  const blob=new Blob([csvOf(I)],{type:'text/csv'});
  try{
    const file=new File([blob],name,{type:'text/csv'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
}

/* ============================================================
   Gestion des actions
   ============================================================ */
function readUi(){ const c=$('#fCom'); if(c) uiState.com=c.value; const v=$('#fVal'); if(v) uiState.val=v.value; }
document.addEventListener('input', e=>{
  if(e.target.id==='fCom') uiState.com=e.target.value;
  if(e.target.id==='fVal') uiState.val=e.target.value;
});
document.addEventListener('change', async e=>{
  if(e.target.dataset.chk!=null){ uiState.checks[+e.target.dataset.chk]=e.target.checked; readUi(); setBar(stepActions(stepAt(CUR.pos))); }
  if(e.target.id==='fileMd' && e.target.files[0]){
    const file=e.target.files[0]; const text=await file.text(); const parsed=parseMD(text);
    store.set(K.local,{text,name:file.name}); PUB={text,parsed,source:`fichier local (${file.name})`};
    if(!CUR) P=parsed;
    toast(`${file.name} chargé : ${parsed.flat.length} étapes${parsed.warnings.length?`, ${parsed.warnings.length} remarque(s)`:''}`,4000); render();
  }
});
document.addEventListener('click', async e=>{
  const z=e.target.closest('[data-zoom]'); if(z){ const o=$('#zoom'); o.firstElementChild.src=z.src; o.style.display='flex'; return; }
  if(e.target.closest('#zoom')){ $('#zoom').style.display='none'; return; }
  if(e.target.closest('#btnHome')){ readUi(); openMenu(); return; }
  const mi=e.target.closest('[data-menu]'); if(mi){ menuAction(mi); return; }
  if(e.target.id==='menu'){ closeMenu(); return; }
  const ack=e.target.closest('[data-ack]'); if(ack){ ackTimer(ack.dataset.ack); if(view==='step') render(); return; }
  const stp=e.target.closest('[data-stop]'); if(stp){ stopTimer(stp.dataset.stop); return; }
  const gt=e.target.closest('[data-goto]'); if(gt){ CUR.pos=+gt.dataset.goto; save(); go('step'); return; }
  const bg=e.target.closest('[data-bgo]'); if(bg){ uiState.i=+bg.dataset.bgo; render(); window.scrollTo(0,0); return; }
  const ar=e.target.closest('[data-arch]'); if(ar){ viewedArchive=store.get(K.arch,[])[+ar.dataset.arch]; view='journal'; renderJournal(viewedArchive); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  readUi(); ensureAudio();
  const act=b.dataset.act, f=CUR&&stepAt(CUR.pos), s=f&&f.step, u=uiState, com=(u.com||'').trim();
  switch(act){
    case 'start': {
      const ch=$('#fChantier').value.trim(), op=$('#fOp').value.trim();
      if(!ch||!op){ toast('Renseigner le chantier et l’opérateur'); return; }
      askNotif(); startIntervention(ch,op); return; }
    case 'resume': viewedArchive=null; go('step'); return;
    case 'home': viewedArchive=null; go('home'); return;
    case 'phases': go('phases'); return;
    case 'journal': viewedArchive=null; go('journal'); return;
    case 'browse': view='browse'; uiState={}; render(); return;
    case 'blist': uiState.i=null; render(); return;
    case 'bprev': uiState.i--; render(); window.scrollTo(0,0); return;
    case 'bnext': uiState.i++; render(); window.scrollTo(0,0); return;
    case 'archives': viewedArchive=null; go('archives'); return;
    case 'archj': view='journal'; renderJournal(viewedArchive); return;
    case 'unlocal': store.del(K.local); toast('Procédure publiée rétablie'); init(); return;
    case 'install': if(deferredInstall){ deferredInstall.prompt(); deferredInstall=null; render(); } return;
    case 'prev': if(CUR.pos>0){ CUR.pos--; save(); uiState={}; render(); window.scrollTo(0,0);} return;
    case 'done': record(f,'ok','',com); nextStep(); return;
    case 'yes': record(f,'ok','oui',com); nextStep(); return;
    case 'no': u.problem = s.siNon || 'Contrôle non conforme.'; u.forceMode=true; u.needComment=true; u.kind='non'; logEvt(f,'non conforme',s.title,'non',''); save(); render(); return;
    case 'val': {
      const v=num(u.val); if(v===null){ toast('Saisir une valeur numérique'); return; }
      const pl=s.plage; if(!pl || (v>=pl.min && v<=pl.max)){ record(f,'ok',String(v),com); nextStep(); return; }
      u.problem = `Valeur ${v} ${pl.unit} hors plage (${plageTxt(pl)}). ${s.siHors||''}`; u.forceMode=true; u.needComment=true; u.kind='val'; u.forcedVal=String(v);
      logEvt(f,'non conforme',s.title,String(v),'hors plage'); save(); render(); return; }
    case 'chk': record(f,'ok',`${u.checks.length}/${u.checks.length}`,com); CUR.results[f.key].checks=u.checks; save(); nextStep(); return;
    case 'chkpart': { const n=u.checks.filter(Boolean).length; u.problem=`Checklist incomplète : ${n}/${u.checks.length} élément(s) coché(s).`; u.forceMode=true; u.needComment=true; u.kind='chk'; render(); return; }
    case 'retry': u.problem=null; u.forceMode=false; u.needComment=false; render(); return;
    case 'force': {
      if(!com && s.commentReq){ toast('Commentaire obligatoire pour cette étape'); $('#fCom')?.focus(); return; }
      const val = u.kind==='val'? u.forcedVal : u.kind==='non'? 'non' : u.kind==='chk'? `${u.checks.filter(Boolean).length}/${u.checks.length}` : '';
      record(f,'forcé',val,com); if(u.kind==='chk') { CUR.results[f.key].checks=u.checks; save(); } nextStep(); return; }
    case 'tstart': startTimer(f); render(); return;
    case 'tearly': u.early=true; setBar(stepActions(f)); return;
    case 'tdone': { const t=CUR.timers.find(x=>x.key===f.key); const early = t && !t.due && !t.acked;
      CUR.timers=CUR.timers.filter(x=>x.key!==f.key); record(f, early?'forcé':'ok', '', early? (com||'validée avant la fin de la minuterie') : com); nextStep(); return; }
    case 'csv': exportCsv(viewedArchive||CUR); return;
    case 'report': go('report'); return;
    case 'print': window.print(); return;
    case 'close': {
      if(!b.dataset.confirm){ b.dataset.confirm='1'; b.textContent='Confirmer la clôture'; return; }
      const closed=closeIntervention(); viewedArchive=closed; toast('Intervention clôturée – pensez à exporter',4000); view='journal'; renderJournal(closed); return; }
  }
});

/* ============================================================
   Démarrage
   ============================================================ */
document.addEventListener('error', e=>{
  const im=e.target; if(im && im.tagName==='IMG' && im.hasAttribute('data-zoom')){
    const d=document.createElement('div'); d.className='imgmissing'; d.innerHTML='📷 Image à fournir :<br>'+esc(im.getAttribute('src')); im.replaceWith(d); }
}, true);
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstall=e; if(view==='home') render(); });
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
setInterval(tick, 1000);
init();
</script>
</body>
</html>
