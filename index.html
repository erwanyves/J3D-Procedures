*{box-sizing:border-box}

@keyframes pulse{50%{opacity:.6}}
main{padding:16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}

.muted{color:var(--muted)} .small{font-size:14px}

.b-action{background:var(--t-action)} .b-contrôle{background:var(--t-controle)} .b-valeur{background:var(--t-valeur)}
.b-avertissement{background:var(--t-avertissement)} .b-minuterie{background:var(--t-minuterie)} .b-checklist{background:var(--t-checklist)} .b-info{background:var(--t-info)}
.stepnum{font-weight:700;color:var(--muted);margin-right:6px}
.phasehead{font-size:14px;color:var(--muted);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px 12px}
.phasehead b{color:var(--fg)}
.text p{margin:8px 0}
.note{background:var(--info-bg);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}

.note.bad{background:var(--bad-bg);border-left:4px solid var(--bad);font-weight:600}

figure{margin:12px 0}

.imgmissing{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:14px}

.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}

.btn:disabled{opacity:.45}
.btnrow{display:flex;gap:10px}

.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.actionbar .inner{max-width:640px;margin:0 auto}

label.fld{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}

.valrow{display:flex;align-items:center;gap:10px}

.list button.li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 2px;color:inherit;cursor:pointer}
.phase-sec{font-weight:700;margin:14px 0 2px;font-size:15px}
.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 2px 8px}
.task{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.task.mine{border-color:var(--mine);background:var(--mine-bg)}
.task.done{opacity:.75}
.task .tt{font-weight:700;font-size:16px}
.task .meta{font-size:13px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px}
.task .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.task .bar{height:5px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}

.lvl{display:inline-block;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
.who{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--mine)}
.log{font-size:14px}
.log .e{padding:8px 0;border-bottom:1px solid var(--line)}
.log .e .h{color:var(--muted);font-size:12px}
.tag{font-size:12px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--info-bg)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.forced{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom));background:var(--top);color:var(--top-fg);padding:10px 16px;border-radius:12px;z-index:50;max-width:90%;display:none;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:none;align-items:center;justify-content:center;padding:10px}
#zoom img{max-width:100%;max-height:100%}
#menu{position:fixed;inset:0;z-index:40;display:none;background:rgba(0,0,0,.45)}
#menu.open{display:block}
#menu .sheet{position:absolute;top:0;left:0;bottom:0;width:min(86vw,340px);background:var(--card);padding:calc(16px + env(safe-area-inset-top)) 12px 16px;overflow-y:auto;box-shadow:4px 0 24px rgba(0,0,0,.3)}
#menu .sheet h3{margin:4px 8px 12px;font-size:16px}
#menu .mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:14px 10px;font-size:16px;cursor:pointer}
#menu .mi.danger{color:var(--bad)}
#menu hr{border:0;border-top:1px solid var(--line);margin:8px 0}
#menu .ver{font-size:12px;color:var(--muted);margin:12px 10px 0}
.gantt{display:grid;gap:2px;font-size:13px;align-items:stretch}
.gantt .gh{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.gantt .gh.gl{text-align:left}
.gantt .gl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 4px 4px 0;line-height:1.2}
.gantt .gc{min-height:22px;border-radius:3px;background:var(--g-empty)}
.glegend .gc{min-height:0}
.g-done{background:var(--g-done)!important} .g-open{background:var(--g-open)!important} .g-mine{background:var(--g-mine)!important} .g-lock{background:var(--g-lock)!important}
.glegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.glegend i{display:inline-block;width:16px;height:16px;border-radius:3px;vertical-align:-3px;margin-right:5px;background:var(--g-empty)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.report table{width:100%;border-collapse:collapse;font-size:12px}
.report th,.report td{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:top}
@media print{
  header.top,.actionbar,.noprint,#toast{display:none!important}
  body{background:#fff;color:#000;padding:0!important}
  .card{border:0;padding:0} main{max-width:none} .report div{overflow:visible!important}
}

# Phase : Logistique de transport jusqu'au chantier

## 1.1 Matériel à acheminer
Début: 1
Fin: 1
Type: checklist
<!-- À COMPLÉTER : listing complet -->
- [ ] Container machine : pompe
- [ ] Container machine : trémie
- [ ] Container machine : imprimante
- [ ] Container machine : compresseur
- [ ] Container machine : box IHM, câbles
- [ ] Chariot élévateur frontal à fourches (2 t, hauteur sous fourche 5,5 m)
- [ ] Matériau (big bags)
- [ ] Groupe électrogène (20 kVA, sorties 16 A et 32 A)
- [ ] Tonne à eau (pas d'eau de pluie)
- [ ] Station totale
- [ ] 4 plaques sous patin
- [ ] Big bag + support pour purges de démarrage et de fin

## 1.2 Point accessoires et outillage
Début: 1
Fin: 1
Type: checklist
<!-- À COMPLÉTER : liste outillage -->
- [ ] Tuyau d'eau 25 m
- [ ] Masse
- [ ] Brosse de nettoyage
- [ ] EPI : casque à visière (ou casque + lunettes)
- [ ] EPI : gants
- [ ] EPI : chaussures de sécurité
Note: prévoir des outillages dédiés avec emplacements prévus.


# Phase : Cartographie
Début: 1
Fin: 1
Rôle: topo

## 2.1 Définir le set de points de repérage
Type: action
À l'aide de la station totale, définir un set de points pour les repérages ultérieurs (multi-positionnements).

## 2.2 Identifier les positions de l'imprimante
Type: action
Identifier les différentes positions de l'imprimante.


# Phase : Implantation
Début: 2
Fin: 2

## 3.1 Positionner l'imprimante
Type: action
Sortir l'imprimante du container et la positionner à son emplacement de travail (repère prédéfini).

## 3.2 Positionner pompe et trémie
Type: action
Sortir la pompe et la trémie du container et les positionner à proximité de l'imprimante.
Note: prévoir un accès protégé pour le chariot élévateur vers la trémie (chargement).

## 3.3 Positionner le groupe électrogène
Type: action

## 3.4 Positionner le big bag de purge
Type: action

## 3.5 Positionner l'IHM
Type: action
Choisir un emplacement avec vue sur la zone de travail.


# Phase : Réglage initial imprimante
Début: 3
Fin: 3
Rôle: machine

## 4.1 Connecter l'imprimante
Type: action

## 4.2 Attendre le voyant orange clignotant
Type: contrôle
Le voyant orange clignote-t-il ?
Si non: ne pas poursuivre

## 4.3 Activer le déplacement
Type: action
Appuyer deux fois en haut à gauche de l'écran de contrôle.
Note: minimum 10 s entre les deux appuis.
<!-- À VÉRIFIER : les notes du 04/10 indiquaient 5 s entre appuis -->

## 4.4 Prépositionner les bras
Type: checklist
- [ ] Clavette de rotation sur bâti
- [ ] Clavette de bras
- [ ] Clavette de pied

## 4.5 Déployer les bras de l'imprimante
Type: action
Placer les plaques de répartition sous les patins.
![Plaques sous patin](images/station_05_plaques_patin.jpg)

## 4.6 Nivelage
Type: Action
Plage: de 0..13 cm
Si hors plage: repositionner la machine

## 4.7 Lever l'imprimante
Type: Action
Chenilles à 48 cm du sol.
Plage: 48..48 cm

## 4.8 Mise à niveau de la machine
Type: contrôle
La machine est-elle de niveau ?
Si non: reprendre le réglage des patins


# Phase : Déploiement du bras
Début: 4
Fin: 4
Rôle: machine
Durée: 15 min

## 5.1 Passer en mode crane
Type: action

## 5.2 Pousser le levier du milieu
Type: avertissement
Replier complètement le bras avant toute autre manœuvre.
![Levier du milieu](images/bras_02_levier_milieu.jpg)

## 5.3 Tirer le levier droit
Type: contrôle
Le bras décolle-t-il bien du patin ?
Si non: ARRÊT – ne pas poursuivre
![Levier droit](images/bras_03_levier_droit.jpg)

## 5.4 Monter à 45° minimum
Type: valeur
Plage: 45..90 °

## 5.5 Déplier
Type: action
Tirer le levier central.

## 5.6 Baisser l'ensemble
Type: action

## 5.7 Déclipser la tête
Type: action

## 5.8 Placer le tuyau
Type: action
Opérateurs: 2
Descendre la structure et placer le tuyau : un opérateur sur escabeau, un qui maintient le tuyau.

## 5.9 Rotation
Type: action
Rotation au levier rouge – toujours en dernier.

## 5.10 Éteindre le moteur
Type: action
<!-- À VÉRIFIER : dans l'ébauche, « Éteindre le moteur » précède la note sur la rotation ; ordre supposé ici : rotation puis arrêt moteur -->


# Phase : Configuration IHM
Début: 5
Fin: 6
Rôle: IHM

## 6.1 Connecter l'IHM
Type: avertissement
Attention particulière au cordon de liaison.

## 6.2 Mode JIB – Boom
Type: valeur
Plage: 4995..5005

## 6.3 Mode JIB – JIB
Type: valeur
Plage: 3095..3105

## 6.4 Fermer les vannes et couper le moteur
Type: action
Fermer les 4 valves (1/4 de tour), puis couper le moteur.
<!-- À VÉRIFIER : les notes mentionnaient ensuite « Réactiver moteur » -->

## 6.5 Vérifier la verticalité de la tête
Type: contrôle
Offset moteur 4.
Si non: corriger l'offset


# Phase : Calage des points (Theodolite Positioning Assistant)
Début: 5
Fin: 6
Rôle: topo
Durée: 20 min

## 7.1 Principe
Type: info
Le fichier source (CSV ou dxf) donne les coordonnées des points du plan. Il faut les caler avec les points relevés sur le terrain.

## 7.2 Choisir les points
Type: checklist
- [ ] Entre 3 et 10 points (5 en général)
- [ ] Points situés entre la machine et la zone d'impression
- [ ] Pas de figure symétrique
- [ ] 3 points connus + 2 points au hasard
- [ ] Au moins 3 m entre deux points

## 7.3 Relever le fichier Target
Type: avertissement
Digitalisation des points : ne pas changer d'altitude entre les mesures et ne pas modifier Z pendant une mesure.

## 7.4 Cohérence source / target
Type: contrôle
Le fichier source et le fichier target ont-ils le même nombre de points ? (1 point = 1 hauteur)
Si non: reprendre le relevé

## 7.5 Matérialiser les points
Type: checklist
- [ ] Sur bitume : clous de charpentier
- [ ] Sur béton : mires à coller (Leica) ou croix sur scotch
- [ ] 2 mires placées hors de portée (pas au sol)


# Phase : Air print
Début: 7
Fin: 7
Rôle: IHM
Durée: 10 min

## 8.1 Transférer le G-code
Type: action
Upload du fichier.

## 8.2 Lancer l'Air print
Type: action
Activer le moteur, passer en mode Air print, puis lancer l'impression : positionnement, offset.

## 8.3 Surveillance
Type: avertissement
Approche lente – rester attentif aux collisions.

## 8.4 Tête sur big bag
Type: action
Positionner la tête sur le big bag pour la purge initiale.
<!-- À VÉRIFIER : 8.4 et 8.5 relèvent plutôt de la préparation impression que de l'Air print -->

## 8.5 Compresseur
Type: action
Connecter le compresseur à l'imprimante et le mettre en route.


# Phase : Préparation pompe
Début: 3
Fin: 7
Rôle: pompe
Durée: 20 min

## 9.1 Montage
Type: action
Monter le malaxeur, puis la vis, puis la jaquette.
<!-- À VÉRIFIER : doublon partiel avec 13.2 à 13.4 (démarrage pompe) -->

## 9.2 Choisir la jaquette
Type: info
Violette (lilas) : petites pièces, petits mouvements, ~85 mm/s.
Verte : grandes pièces, grands mouvements, ~120 mm/s.
Note: le débit se règle en resserrant la jaquette (usure).

## 9.3 Vérifier les robinets de purge
Type: contrôle
Les robinets de purge sont-ils en bon état et en position ?
Si non: corriger avant de poursuivre


# Phase : Raccordement eau
Début: 2
Fin: 2
Rôle: pompe

const MD_URL='procedure_J3D.md', CFG_URL='firebase-config.json';
const store={

/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);

const fmtD=ms=>{const d=new Date(ms);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;};
const fmtDur=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${pad(m)}:${pad(x)}`;};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',ms);}

/* =====================================================================
   Parseur Markdown
   ===================================================================== */
const TYPES={action:'action',controle:'contrôle',valeur:'valeur',avertissement:'avertissement',minuterie:'minuterie',checklist:'checklist',info:'info'};
function parseDuree(v){const m=noAcc(v).match(/([\d.,]+)\s*(h|min|mn|m|s)?/);if(!m)return null;const n=num(m[1]),u=m[2]||'min';return u==='h'?n*3600:u==='s'?n:n*60;}
function parsePlage(v){
  const N='(-?\\d+(?:[.,]\\d+)?)';
  let t=String(v).trim().replace(/^(?:de|entre|from|between)\s+/i,''); let m;
  if((m=t.match(new RegExp('^'+N+'\\s*(?:\\.\\.\\.?|à|a|et|-|–|—|to|/)\\s*'+N+'\\s*(.*)$','i')))) return {min:num(m[1]),max:num(m[2]),unit:m[3].trim()};
  if((m=t.match(new RegExp('^'+N+'\\s*(?:±|\\+/-|\\+-)\\s*'+N+'\\s*(.*)$')))) return {min:num(m[1])-num(m[2]),max:num(m[1])+num(m[2]),unit:m[3].trim()};
  if((m=t.match(new RegExp('^(?:<=?|≤|max(?:i(?:mum)?)?\\.?|inf[ée]rieur(?:e)?\\s+(?:ou\\s+[ée]gal(?:e)?\\s+)?[àa]|jusqu.[àa])\\s*'+N+'\\s*(.*)$','i')))) return {min:-Infinity,max:num(m[1]),unit:m[2].trim()};
  if((m=t.match(new RegExp('^(?:>=?|≥|min(?:i(?:mum)?)?\\.?|sup[ée]rieur(?:e)?\\s+(?:ou\\s+[ée]gal(?:e)?\\s+)?[àa]|au\\s+moins)\\s*'+N+'\\s*(.*)$','i')))) return {min:num(m[1]),max:Infinity,unit:m[2].trim()};
  if((m=t.match(new RegExp('^'+N+'\\s*(.*?)\\s*(mini?|minimum|maxi?|maximum)\\.?$','i')))){const isMin=/^min/i.test(m[3]);return isMin?{min:num(m[1]),max:Infinity,unit:m[2].trim()}:{min:-Infinity,max:num(m[1]),unit:m[2].trim()};}
  if((m=t.match(new RegExp('^'+N+'\\s*([^\\d]*)$')))) return {min:num(m[1]),max:num(m[1]),unit:m[2].trim()};
  return null;
}
function plageTxt(pl){const u=pl.unit?' '+pl.unit:'';if(pl.min===-Infinity)return `≤ ${pl.max}${u}`;if(pl.max===Infinity)return `≥ ${pl.min}${u}`;if(pl.min===pl.max)return `${pl.min}${u}`;return `${pl.min} à ${pl.max}${u}`;}
function parseMD(text){
  const warnings=[],meta={},phases=[];
  let src=String(text||'').replace(/\r\n?/g,'\n').replace(/<!--[\s\S]*?-->/g,m=>m.replace(/[^\n]/g,''));
  const lines=src.split('\n'); let i=0;
  if(lines[0]&&lines[0].trim()==='---'){i=1;while(i<lines.length&&lines[i].trim()!=='---'){const m=lines[i].match(/^\s*([^:]+?)\s*:\s*(.*)$/);if(m)meta[noAcc(m[1])]=m[2].trim();i++;}i++;}
  let ph=null,st=null;
  for(;i<lines.length;i++){
    const raw=lines[i],ln=i+1,l=raw.trim(); if(!l) continue; let m;
    if((m=raw.match(/^#\s+(.+)$/))){ph={name:m[1].replace(/^Phase\s*:\s*/i,'').trim(),line:ln,steps:[],text:[],notes:[]};phases.push(ph);st=null;continue;}
    if((m=raw.match(/^##\s+(.+)$/))){
      if(!ph){warnings.push({line:ln,msg:'Étape avant toute phase'});ph={name:'(sans phase)',line:ln,steps:[],text:[],notes:[]};phases.push(ph);}
      const t=m[1].trim(),mm=t.match(/^(\d+(?:\.\d+)*[a-z]?)\s+(.+)$/i);
      st={num:mm?mm[1]:'',title:mm?mm[2]:t,type:'action',typeSet:false,line:ln,text:[],notes:[],items:[],images:[]};ph.steps.push(st);continue;}
    if(/^#{3,}\s/.test(raw)){warnings.push({line:ln,msg:'Titre ### non géré (utiliser # pour une phase, ## pour une étape)'});continue;}
    if(!ph) continue;
    const tgt=st||ph;
    if((m=l.match(/^([A-Za-zÀ-ÿ ]+?)\s*:\s*(.*)$/))){
      const k=noAcc(m[1]),v=m[2].trim();let used=true;
      switch(k){
        case 'type':{const t=TYPES[noAcc(v)];if(st){if(t){st.type=t;st.typeSet=true;}else warnings.push({line:ln,msg:`Type inconnu « ${v} »`});}break;}
        case 'plage':{const pl=parsePlage(v);if(pl&&st)st.plage=pl;else warnings.push({line:ln,msg:`Plage illisible « ${v} » (ex. : 7..9 bar, de 0 à 13 cm, 28 ±1 cm, ≥ 45 °, 13 cm max)`});break;}
        case 'duree':{const d=parseDuree(v);if(d===null)warnings.push({line:ln,msg:`Durée illisible « ${v} »`});tgt.duree=d;tgt.dureeTxt=v;break;}
        case 'si non':tgt.siNon=v;break;
        case 'si hors plage':tgt.siHors=v;break;
        case 'operateurs':tgt.operateurs=v;break;
        case 'role':tgt.role=v;break;
        case 'note':tgt.notes.push(v);break;
        case 'repeter':tgt.repeat=/^(oui|yes|true|1)/i.test(noAcc(v));break;
        case 'commentaire':tgt.commentReq=/oblig/i.test(noAcc(v));break;
        case 'debut':{const n=parseInt(v,10);if(isNaN(n))warnings.push({line:ln,msg:`Début illisible « ${v} »`});else tgt.debut=n;break;}
        case 'fin':{const n=parseInt(v,10);if(isNaN(n))warnings.push({line:ln,msg:`Fin illisible « ${v} »`});else tgt.fin=n;break;}
        default:used=false;
      }
      if(used) continue;
    }
    if((m=l.match(/^[-*]\s+\[[ xX]\]\s+(.+)$/))){if(st)st.items.push(m[1]);else warnings.push({line:ln,msg:'Case à cocher hors étape'});continue;}
    if((m=l.match(/^!\[([^\]]*)\]\(\s*([^)\s]+)\s*\)/))){if(st)st.images.push({alt:m[1],src:m[2]});else warnings.push({line:ln,msg:'Image hors étape'});continue;}
    tgt.text.push(l.replace(/^[-*]\s+/,'• '));
  }
  phases.forEach(p=>{
    if(p.fin!=null&&p.debut!=null&&p.fin<p.debut) warnings.push({line:p.line,msg:`Phase « ${p.name} » : Fin < Début`});
    p.steps.forEach(s=>{
      const lbl=`Étape ${s.num||s.title}`;
      if(!s.typeSet) warnings.push({line:s.line,msg:`${lbl} : pas de « Type: » (action par défaut)`});
      if(s.type==='valeur'&&!s.plage) warnings.push({line:s.line,msg:`${lbl} : Type valeur sans Plage`});
      if(s.type==='minuterie'&&!s.duree) warnings.push({line:s.line,msg:`${lbl} : minuterie sans Durée`});
      if(s.type==='checklist'&&!s.items.length) warnings.push({line:s.line,msg:`${lbl} : checklist sans case « - [ ] »`});
    });

  const tasks=buildTasks(phases);
  return {meta,phases,flat,tasks,warnings};
}
/* Tâches : une phase = une tâche ; une étape portant Début/Fin devient une tâche indépendante.
   Sans Début/Fin, une tâche prend le niveau suivant la précédente (enchaînement simple). */
function buildTasks(phases){
  const tasks=[]; let last=0;
  const mk=(id,title,ph,steps,src)=>{
    const debut = src.debut ?? (last+1);
    const fin = Math.max(debut, src.fin ?? debut);
    const ops = Math.max(1, parseInt(src.operateurs ?? ph.operateurs ?? 1,10) || 1);
    const t={id,title,phase:ph,steps,debut,fin,ops,role:src.role||ph.role||''};
    tasks.push(t); last=fin; return t;
  };
  phases.forEach((ph,pi)=>{
    const rest=[];
    ph.steps.forEach((st,si)=>{
      const f={p:pi,s:si,key:`s${pi}_${si}`,phase:ph,step:st};
      if(st.debut!=null) mk(`t${pi}_${si}`,`${st.num} ${st.title}`.trim(),ph,[f],st);
      else rest.push(f);
    });
    if(rest.length) mk(`t${pi}`,ph.name,ph,rest,ph);
  });
  return tasks;
}

/* =====================================================================

function setPath(obj,path,val){const ks=path.split('.');let o=obj;for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||o[ks[i]]===null)o[ks[i]]={};o=o[ks[i]];}if(val===undefined)delete o[ks.at(-1)];else o[ks.at(-1)]=val;}
function getPath(obj,path){return path.split('.').reduce((o,k)=>o==null?undefined:o[k],obj);}

const LocalStore={
  kind:'local', label:'Local (ce téléphone)',
  async init(){ this.bc = ('BroadcastChannel' in window)? new BroadcastChannel('j3d') : null; this.subs=new Set();
    if(this.bc) this.bc.onmessage=()=>this.emit(); window.addEventListener('storage',e=>{ if(e.key===K.db) this.emit(); }); return true; },

  watch(cid,cb){ const f=()=>{ const c=this.db().chantiers[cid]; cb(c?{id:cid,...c}:null,{pending:false,fromCache:false}); }; f(); return this.onChange(f); },
  watchLog(cid,cb){ const f=()=>cb((this.db().logs[cid]||[]).slice()); f(); return this.onChange(f); },
  async create(data){ const d=this.db(); const id=uid(); d.chantiers[id]=data; d.logs[id]=[]; this.save(d); return id; },
  async update(cid,fields){ const d=this.db(); const c=d.chantiers[cid]; if(!c) return; Object.entries(fields).forEach(([p,v])=>{

  async take(cid,tid,name,max){ const d=this.db(); const c=d.chantiers[cid]; const t=getPath(c,`tasks.${tid}`)||{}; const ops=t.ops||[];

  async log(cid,e){ const d=this.db(); (d.logs[cid]=d.logs[cid]||[]).push(e); this.save(d); },
  union:a=>({__union:a}), remove:a=>({__remove:a})

const FireStore={
  kind:'firebase', label:'Synchronisé',

  watchLog(cid,cb){ const F=this.F; return F.onSnapshot(F.query(F.collection(this.db,'chantiers',cid,'log'),F.orderBy('t')), s=>cb(s.docs.map(d=>d.data())), e=>console.warn(e)); },

      const u={[`tasks.${tid}.ops`]:F.arrayUnion(name)}; if(!t.status||t.status==='libre') u[`tasks.${tid}.status`]='en cours'; if(!t.startedAt) u[`tasks.${tid}.startedAt`]=Date.now(); return u; };
    if(navigator.onLine){
      try{ return await F.runTransaction(this.db, async tx=>{ const s=await tx.get(ref); const t=getPath(s.data()||{},`tasks.${tid}`)||{}; const u=apply(t); if(u===false) return false; if(u) tx.update(ref,u); return true; }); }
      catch(e){ console.warn(e); }
    }
    const t=getPath(CH||{},`tasks.${tid}`)||{}; const u=apply(t); if(u===false) return false; if(u) F.updateDoc(ref,u).catch(e=>console.warn(e)); return true; },
  async log(cid,e){ const F=this.F; F.addDoc(F.collection(this.db,'chantiers',cid,'log'),e).catch(x=>console.warn(x)); },
  union:a=>({__union:a}), remove:a=>({__remove:a})
};

/* =====================================================================
   État de l'appli
   ===================================================================== */
let S=LocalStore;          // stockage actif
let PUB=null;              // procédure disponible { text, parsed, source, missing }
let LIST=[];               // chantiers (tous)
let CID=store.get(K.cid);  // chantier ouvert
let CH=null, CHP=null;     // document chantier + procédure parsée du chantier
let META={pending:false,fromCache:false};
let LOG=[];                // journal du chantier ouvert
const QS_USER=new URLSearchParams(location.search).get('user');   // ?user=Nom : nom forcé pour cet onglet (essais)
let USER=QS_USER||store.get(K.user,'');
let view='home', uiState={}, curTid=null, viewedArch=null;
let unsubCh=null, unsubLog=null;
let audioCtx=null, wakeLock=null, deferredInstall=null;
let TIMERS=store.get(K.timers,[]);  // minuteries locales à ce téléphone

/* ---------- chargement procédure ---------- */
async function loadPublished(){
  const local=store.get(K.local); if(local&&local.text) return {text:local.text,source:`fichier local (${local.name||'.md'})`};
  let missing=false;
  try{ const r=await fetch(MD_URL,{cache:'no-cache'}); if(r.ok) return {text:await r.text(),source:'publiée'}; missing=true; }catch(e){}
  const emb=$('#embedded-md').textContent;
  const why=missing?'fichier MD introuvable sur le serveur':'hors ligne, fichier non encore en cache';
  if(emb&&!emb.includes('/*EMBEDDED_MD*/')) return {text:emb,source:`copie intégrée (${why})`,missing};
  return {text:'',source:'aucune',missing};
}
async function loadConfig(){ try{ const r=await fetch(CFG_URL,{cache:'no-cache'}); if(r.ok){ const c=await r.json(); if(c&&c.projectId) return c; } }catch(e){} return null; }

async function init(){
  const pub=await loadPublished(); PUB={...pub,parsed:parseMD(pub.text)};
  const cfg=await loadConfig();
  if(cfg){ try{ await FireStore.init(cfg); S=FireStore; }catch(e){ console.warn('Firebase indisponible',e); toast('⚠ Synchronisation indisponible – mode local',4000); await LocalStore.init(); S=LocalStore; } }
  else { await LocalStore.init(); S=LocalStore; }
  S.watchList(l=>{ LIST=l; if(view==='home'||view==='archives') render(); });
  if(CID) openChantier(CID,false); else render();
  warmImages(PUB.parsed);
  window.addEventListener('online',renderSync); window.addEventListener('offline',renderSync);
}
function warmImages(parsed){ parsed.flat.forEach(f=>f.step.images.forEach(im=>fetch(im.src).catch(()=>{}))); }

/* ---------- chantier ---------- */
async function createChantier(name){
  const P=PUB.parsed;
  const data={name, createdAt:Date.now(), createdBy:USER, closedAt:null,
    procName:P.meta.procedure||'', procVersion:P.meta.version||'?', procDate:P.meta.date||'', procSource:PUB.source, mdText:PUB.text, tasks:{}, users:{[USER]:Date.now()}};
  const id=await S.create(data);
  await S.log(id,{t:Date.now(),by:USER,task:'',phase:'',num:'',title:`Chantier créé – ${name}`,type:'événement',status:'début',value:'',unit:'',comment:''});
  openChantier(id,true);
}
function openChantier(id,goBoard=true){
  if(unsubCh) unsubCh(); if(unsubLog) unsubLog();
  CID=id; store.set(K.cid,id); CH=null; CHP=null; LOG=[];
  let firstLoad=true;
  unsubCh=S.watch(id,(c,meta)=>{
    META=meta||META;
    if(!c){ if(!firstLoad||!META.fromCache){ CH=null; CID=null; store.del(K.cid); if(view!=='home'){ toast('Chantier introuvable'); go('home'); } } return; }
    const prev=CH; CH=c; if(!CHP || prev?.mdText!==c.mdText) CHP=parseMD(c.mdText);
    if(firstLoad){ firstLoad=false; heartbeat(); requestWake(); if(goBoard || view==='home') go(c.closedAt?'journal':'board'); else render(); return; }
    onRemoteChange(prev,c);
  });
  unsubLog=S.watchLog(id,l=>{ LOG=l; if(view==='journal') render(); });
}
function leaveChantier(){ if(unsubCh) unsubCh(); if(unsubLog) unsubLog(); unsubCh=unsubLog=null; CID=null; CH=null; CHP=null; store.del(K.cid); releaseWake(); go('home'); }
function heartbeat(){ if(CID&&CH&&USER&&!CH.closedAt) S.update(CID,{[`users.${USER}`]:Date.now()}); }
setInterval(heartbeat,60000);

/* ---------- modèle des tâches ---------- */
const TS=tid=>(CH&&CH.tasks&&CH.tasks[tid])||{};
const isDone=t=>TS(t.id).status==='terminée';
const isOpen=t=>CHP.tasks.every(o=>o===t||o.fin>=t.debut||isDone(o));
function taskState(t){
  const s=TS(t.id), ops=s.ops||[];
  if(s.status==='terminée') return 'done';
  if(!isOpen(t)) return 'locked';
  if(ops.includes(USER)) return 'mine';
  if(ops.length>=t.ops) return 'full';
  if(ops.length) return 'shared';
  return 'free';
}
function levelInfo(){ const undone=CHP.tasks.filter(t=>!isDone(t)); return undone.length? Math.min(...undone.map(t=>t.fin)) : null; }
function taskPos(t){ const s=TS(t.id); return Math.min(s.pos||0, t.steps.length-1); }
function doneCount(t){ const r=TS(t.id).results||{}; return t.steps.filter(f=>r[f.key]).length; }

function onRemoteChange(prev,c){
  // notifications utiles : tâches nouvellement ouvertes, chantier clôturé
  if(c.closedAt && !prev?.closedAt){ toast('Chantier clôturé'); }
  const prevOpen=new Set(); if(prev){ const save=CH; CH=prev; CHP.tasks.forEach(t=>{ if(isOpen(t)&&!isDone(t)) prevOpen.add(t.id); }); CH=save; }
  const newly=CHP.tasks.filter(t=>isOpen(t)&&!isDone(t)&&!prevOpen.has(t.id));
  if(prev && newly.length){ toast(`Nouvelle(s) tâche(s) : ${newly.map(t=>t.title).join(', ')}`,4000); try{navigator.vibrate&&navigator.vibrate(150);}catch(e){} }
  if(view==='step' && curTid){
    const t=CHP.tasks.find(x=>x.id===curTid), a=prev?.tasks?.[curTid]||{}, b=c.tasks?.[curTid]||{};
    if(!t || a.pos!==b.pos || a.status!==b.status || JSON.stringify(a.ops)!==JSON.stringify(b.ops)){ uiState={}; render(); }
    else renderSync();
    return;
  }
  render();
}

/* =====================================================================
   Actions sur les tâches
   ===================================================================== */
function logEvt(t,f,status,label,value,comment){
  if(!CID) return;
  S.log(CID,{t:Date.now(),by:USER,task:t?t.title:'',phase:f?f.phase.name:(t?t.phase.name:''),num:f?f.step.num:'',title:f?f.step.title:label,
    type:f?f.step.type:'événement',status,value:value??'',unit:f&&f.step.plage?f.step.plage.unit:'',comment:comment||''});
}
async function takeTask(t){
  if(!isOpen(t)){ toast('Tâche pas encore ouverte'); return; }
  const ok=await S.take(CID,t.id,USER,t.ops);
  if(ok===false){ toast(`Tâche complète (${t.ops} opérateur${t.ops>1?'s':''} max)`); return; }
  // mise à jour locale immédiate (le serveur confirme ensuite)
  { const s=TS(t.id), ops=s.ops||[]; if(!ops.includes(USER)) setPath(CH,`tasks.${t.id}.ops`,[...ops,USER]); if(!s.status||s.status==='libre') setPath(CH,`tasks.${t.id}.status`,'en cours'); }
  logEvt(t,null,'prise',`Tâche prise : ${t.title}`,'','');
  curTid=t.id; go('step');
}
async function releaseTask(t){
  const s=TS(t.id), ops=(s.ops||[]).filter(x=>x!==USER);
  const u={[`tasks.${t.id}.ops`]:S.remove([USER])}; if(!ops.length && s.status!=='terminée') u[`tasks.${t.id}.status`]='libre';
  setPath(CH,`tasks.${t.id}.ops`,ops); if(!ops.length && s.status!=='terminée') setPath(CH,`tasks.${t.id}.status`,'libre');
  S.update(CID,u); logEvt(t,null,'relâchée',`Tâche relâchée : ${t.title}`,'','');
  curTid=null; go('board');
}
async function reopenTask(t){
  setPath(CH,`tasks.${t.id}.status`,'en cours'); setPath(CH,`tasks.${t.id}.ops`,[...new Set([...(TS(t.id).ops||[]),USER])]);
  S.update(CID,{[`tasks.${t.id}.status`]:'en cours',[`tasks.${t.id}.doneAt`]:null,[`tasks.${t.id}.ops`]:S.union([USER])});
  logEvt(t,null,'rouverte',`Tâche rouverte : ${t.title}`,'',''); curTid=t.id; go('step');
}
async function recordStep(t,f,status,value,comment,extra){
  const pos=taskPos(t), last=pos>=t.steps.length-1;
  const res={status,value:value??'',comment:comment||'',at:Date.now(),by:USER,...(extra||{})};
  const u={[`tasks.${t.id}.results.${f.key}`]:res};
  if(last){ u[`tasks.${t.id}.status`]='terminée'; u[`tasks.${t.id}.doneAt`]=Date.now(); u[`tasks.${t.id}.pos`]=pos; }
  else u[`tasks.${t.id}.pos`]=pos+1;
  // mise à jour optimiste locale pour un affichage immédiat
  Object.entries(u).forEach(([p,v])=>setPath(CH,p,v));
  logEvt(t,f,status,f.step.title,value,comment);
  S.update(CID,u);
  uiState={};
  if(last){ logEvt(t,null,'terminée',`Tâche terminée : ${t.title}`,'',''); toast(`✓ ${t.title} terminée`); curTid=null; go('board'); }
  else { render(); window.scrollTo(0,0); }
}
async function setPos(t,p){ setPath(CH,`tasks.${t.id}.pos`,p); S.update(CID,{[`tasks.${t.id}.pos`]:p}); uiState={}; render(); window.scrollTo(0,0); }
async function closeChantier(){
  await S.update(CID,{closedAt:Date.now()}); logEvt(null,null,'fin','Chantier clôturé','','');
  TIMERS=TIMERS.filter(x=>x.cid!==CID); store.set(K.timers,TIMERS); toast('Chantier clôturé – pensez à exporter le journal',4000);
}

/* =====================================================================
   Minuteries locales (son, vibration, notification)
   ===================================================================== */
function startTimer(t,f){
  ensureAudio(); askNotif(); const s=f.step,dur=s.duree||60, key=`${CID}:${t.id}:${f.key}`;
  TIMERS=TIMERS.filter(x=>x.key!==key);
  TIMERS.push({key,cid:CID,label:`${s.num} ${s.title}`,dur,endAt:Date.now()+dur*1000,repeat:!!s.repeat,due:false});
  store.set(K.timers,TIMERS); logEvt(t,f,'minuterie',s.title,s.dureeTxt||fmtDur(dur),s.repeat?'alerte périodique démarrée':'démarrée'); renderTimers();
}
const timerOf=(t,f)=>TIMERS.find(x=>x.key===`${CID}:${t.id}:${f.key}`);
function stopTimer(key){ TIMERS=TIMERS.filter(x=>x.key!==key); store.set(K.timers,TIMERS); renderTimers(); if(view==='step') render(); }
function ackTimer(key){ const x=TIMERS.find(y=>y.key===key); if(!x) return; if(x.repeat){ x.due=false; x.endAt=Date.now()+x.dur*1000; logEvt(null,null,'alerte',`Alerte acquittée : ${x.label}`,'',''); } else { x.due=false; x.acked=true; } store.set(K.timers,TIMERS); renderTimers(); }
function tick(){
  const now=Date.now(); let ch=false;
  TIMERS.forEach(x=>{ if(!x.due&&!x.acked&&now>=x.endAt){ x.due=true; ch=true; alarm(x.label,x.repeat?'Alerte périodique':'Minuterie écoulée'); if(x.cid===CID) logEvt(null,null,'alerte',`Échéance : ${x.label}`,'',''); } });
  if(ch){ store.set(K.timers,TIMERS); if(view==='step') render(); }
  renderTimers();
  const cd=$('#cd'); if(cd){ const x=TIMERS.find(y=>y.key===cd.dataset.key); if(x) cd.textContent=x.due||x.acked?'00:00':fmtDur((x.endAt-now)/1000); }
}
function renderTimers(){
  const box=$('#timers'), list=TIMERS.filter(x=>x.cid===CID && !(x.acked&&!x.repeat)); if(!CID||!list.length){ box.innerHTML=''; return; }
  const now=Date.now();
  box.innerHTML=list.map(x=>`<div class="tchip ${x.due?'due':''}">⏱ <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.label)}</span>
    <b>${x.due?'ÉCHU':fmtDur((x.endAt-now)/1000)}</b>${x.due?`<button class="x" data-ack="${esc(x.key)}">${x.repeat?'Fait, relancer':'OK'}</button>`:(x.repeat?`<button class="x" data-stop="${esc(x.key)}">Arrêter</button>`:'')}</div>`).join('');
}
function ensureAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}}
function beep(){try{ensureAudio();if(!audioCtx)return;const t0=audioCtx.currentTime;for(let k=0;k<3;k++){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=880;g.gain.setValueAtTime(.0001,t0+k*.45);g.gain.exponentialRampToValueAtTime(.3,t0+k*.45+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+k*.45+.3);o.connect(g).connect(audioCtx.destination);o.start(t0+k*.45);o.stop(t0+k*.45+.32);}}catch(e){}}
function askNotif(){try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();}catch(e){}}
async function alarm(label,title){beep();try{navigator.vibrate&&navigator.vibrate([400,200,400,200,600]);}catch(e){}toast(`⏱ ${title} : ${label}`,6000);
  try{if('Notification'in window&&Notification.permission==='granted'&&navigator.serviceWorker){const reg=await navigator.serviceWorker.getRegistration();if(reg)reg.showNotification(title,{body:label,tag:'j3d-'+label,renotify:true,icon:'icons/icon-192.png',vibrate:[400,200,400]});}}catch(e){}}
async function requestWake(){try{if('wakeLock'in navigator&&document.visibilityState==='visible')wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
function releaseWake(){try{wakeLock&&wakeLock.release();wakeLock=null;}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&CID){requestWake();tick();heartbeat();}});

/* =====================================================================
   Rendu
   ===================================================================== */
function go(v){ view=v; uiState={}; render(); window.scrollTo(0,0); }
function setBar(html){ const b=$('#bar'); if(html){ $('#barInner').innerHTML=html; b.hidden=false; } else { b.hidden=true; $('#barInner').innerHTML=''; }
  document.body.style.paddingBottom=(b.hidden?24:b.offsetHeight+24)+'px'; }
function header(title,sub,prog){ $('#hTitle').textContent=title; $('#hSub').textContent=sub||''; const pg=$('#hProg'); if(prog==null) pg.hidden=true; else { pg.hidden=false; pg.firstElementChild.style.width=(prog*100).toFixed(1)+'%'; } renderSync(); }
function renderSync(){
  const el=$('#sync'); el.hidden=false; el.className='sync';
  if(S.kind==='local'){ el.textContent='Local'; return; }
  if(!navigator.onLine){ el.textContent='Hors ligne'; el.classList.add('off'); return; }
  if(META.pending){ el.textContent='Synchro…'; el.classList.add('pend'); return; }
  el.textContent='● En ligne';
}
function render(){
  renderTimers();
  if(['board','step','journal','report'].includes(view) && (!CH||!CHP)){ header('Chargement…','',null); $('#app').innerHTML='<div class="card muted">Connexion au chantier…</div>'; setBar(''); return; }
  ({home:renderHome,board:renderBoard,step:renderStep,journal:renderJournal,report:renderReport,browse:renderBrowse,archives:renderArchives,phases:renderLevels}[view]||renderHome)();
}

/* ---------- Accueil ---------- */

    <div class="small muted" style="margin-top:6px">Stockage : <b>${esc(S.label)}</b>${S.kind==='local'?' – pas de partage entre téléphones (firebase-config.json absent)':''}</div></div>`;
  if(USER){
    h+=`<div class="card"><h3>Chantiers en cours</h3>${open.length? `<div class="list">${open.map(c=>{const n=Object.values(c.tasks||{}).filter(x=>x.status==='terminée').length;

      <label class="fld" for="fChantier">Nouveau chantier</label><input class="inp" id="fChantier" placeholder="Nom / adresse du chantier">

  }

  h+=`<div class="card"><h3>Procédure</h3><dl class="kv"><dt>Titre</dt><dd>${esc(m.procedure||'—')}</dd><dt>Version</dt><dd>${esc(m.version||'—')} ${m.statut?`<span class="muted small">(${esc(m.statut)})</span>`:''}</dd>
    <dt>Date</dt><dd>${esc(m.date||'—')}</dd><dt>Source</dt><dd>${esc(PUB.source)}</dd><dt>Contenu</dt><dd>${PUB.parsed.tasks.length} tâches, ${PUB.parsed.flat.length} étapes</dd></dl>
    ${w.length?`<details style="margin-top:8px"><summary>⚠ ${w.length} remarque(s) sur le fichier</summary><div class="small">${w.map(x=>`<div>${x.line?`ligne ${x.line} : `:''}${esc(x.msg)}</div>`).join('')}</div></details>`:'<div class="note ok small" style="margin-top:10px">Fichier conforme aux conventions</div>'}
    <div class="btnrow"><button class="btn" data-act="browse">Consulter</button><button class="btn" data-act="levels">Séquencement</button></div>
    <label class="btn ghost" style="text-align:center;line-height:34px">Charger un fichier .md<input type="file" id="fileMd" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden></label>
    ${store.get(K.local)?`<button class="btn ghost" data-act="unlocal">Revenir à la procédure publiée</button>`:''}</div>
  <div class="card"><button class="btn ghost" data-act="archives">Chantiers clôturés (${LIST.filter(c=>c.closedAt).length})</button>
    ${deferredInstall?'<button class="btn" data-act="install">Installer l’appli sur le téléphone</button>':''}</div>`;
  $('#app').innerHTML=h; setBar('');

/* ---------- Tableau du chantier ---------- */
function taskCard(t,st){
  const s=TS(t.id), ops=s.ops||[], n=doneCount(t), N=t.steps.length;
  const lvl=t.debut===t.fin?`niv. ${t.debut}`:`niv. ${t.debut}→${t.fin}`;
  let acts='';
  if(st==='mine') acts=`<button class="btn sm primary" data-cont="${t.id}">Continuer ›</button>`;
  else if(st==='free') acts=`<button class="btn sm primary" data-take="${t.id}">Je prends</button>`;
  else if(st==='shared') acts=`<button class="btn sm" data-take="${t.id}">Rejoindre</button>`;
  else if(st==='done') acts=`<button class="btn sm ghost" data-reopen="${t.id}">Rouvrir</button>`;
  return `<div class="task ${st==='mine'?'mine':''} ${st==='done'?'done':''}">
    <div class="tt">${st==='done'?'✓ ':''}${esc(t.title)}</div>
    <div class="meta"><span class="lvl">${lvl}</span>${t.role?`<span>${esc(t.role)}</span>`:''}<span>${n}/${N} étape${N>1?'s':''}</span>${t.ops>1?`<span>👥 ${ops.length}/${t.ops}</span>`:''}
      ${ops.length?`<span class="who">👷 ${ops.map(esc).join(', ')}</span>`:''}${st==='done'&&s.doneAt?`<span>fini ${fmtT(s.doneAt)}</span>`:''}</div>
    ${n&&st!=='done'?`<div class="bar"><i style="width:${(n/N*100).toFixed(0)}%"></i></div>`:''}
    ${acts?`<div class="acts">${acts}</div>`:''}</div>`;
}
function renderBoard(){
  const tasks=CHP.tasks, by={mine:[],free:[],shared:[],full:[],done:[],locked:[]};
  tasks.forEach(t=>by[taskState(t)].push(t));
  const done=by.done.length, lv=levelInfo();
  header(CH.name, CH.closedAt?'Clôturé':(lv?`Niveaux ouverts jusqu’à ${lv} · ${done}/${tasks.length} tâches`:'Toutes les tâches sont terminées'), done/tasks.length);
  const now=Date.now(), online=Object.entries(CH.users||{}).filter(([n,ts])=>now-ts<3*60000).map(([n])=>n);
  let h=`<div class="small muted" style="margin-bottom:6px">👥 Connectés : <b>${online.length?online.map(esc).join(', '):'—'}</b></div>`;
  if(!lv) h+=`<div class="note ok">Toutes les tâches sont terminées. Pensez à clôturer le chantier et à exporter le journal.</div>`;
  if(by.mine.length) h+=`<div class="sec">Mes tâches</div>`+by.mine.map(t=>taskCard(t,'mine')).join('');
  if(by.free.length||by.shared.length) h+=`<div class="sec">Disponibles</div>`+[...by.free.map(t=>taskCard(t,'free')),...by.shared.map(t=>taskCard(t,'shared'))].join('');
  if(by.full.length) h+=`<div class="sec">En cours par d’autres</div>`+by.full.map(t=>taskCard(t,'full')).join('');
  if(!by.mine.length&&!by.free.length&&!by.shared.length&&lv) h+=`<div class="note">Aucune tâche disponible pour vous : attendez la fin des tâches en cours.</div>`;
  if(by.locked.length) h+=`<details class="card" style="margin-top:14px"><summary>À venir : ${by.locked.length} tâche(s)</summary><div class="small">${by.locked.map(t=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="lvl">niv. ${t.debut}</span> ${esc(t.title)}</div>`).join('')}</div></details>`;
  if(by.done.length) h+=`<details style="margin-top:6px"><summary class="sec" style="display:list-item">Terminées (${by.done.length})</summary>${by.done.map(t=>taskCard(t,'done')).join('')}</details>`;
  $('#app').innerHTML=h;
  setBar(`<div class="btnrow"><button class="btn" data-act="journal">Journal</button><button class="btn" data-act="levels">Séquencement</button></div>`);
}

/* ---------- Écran d'étape ---------- */
function stepBody(f,ro,t){
  const s=f.step,p=f.phase,first=t? t.steps[0]===f : f.s===0;
  let h=`<div class="phasehead"><span><b>${esc(t?t.title:p.name)}</b></span>${(s.role||p.role)?`<span>Rôle : <b>${esc(s.role||p.role)}</b></span>`:''}
    ${(s.operateurs||p.operateurs)?`<span>👥 <b>${esc(s.operateurs||p.operateurs)}</b></span>`:''}${(first&&p.dureeTxt)?`<span>⏱ ≈ <b>${esc(p.dureeTxt)}</b></span>`:''}</div>`;
  if(first){ p.text.forEach(x=>h+=`<div class="note small">${inl(x)}</div>`); p.notes.forEach(n=>h+=`<div class="note">${inl(n)}</div>`); }
  h+=`<div class="card"><div style="margin-bottom:8px"><span class="badge b-${s.type}">${esc(s.type)}</span></div>
    <h2><span class="stepnum">${esc(s.num)}</span>${inl(s.title)}</h2><div class="text">${s.text.map(x=>`<p>${inl(x)}</p>`).join('')}</div>
    ${s.images.map(im=>`<figure><img src="${esc(im.src)}" alt="${esc(im.alt)}" loading="lazy" data-zoom>${im.alt?`<figcaption>${esc(im.alt)}</figcaption>`:''}</figure>`).join('')}
    ${s.notes.map(n=>`<div class="note warn">${inl(n)}</div>`).join('')}`;
  if(s.plage) h+=`<div class="target">${s.plage.min===s.plage.max?'Cible':'Plage'} : <b>${esc(plageTxt(s.plage))}</b></div>`;
  if(s.siHors&&s.type!=='valeur') h+=`<div class="note warn small">Si hors plage : ${inl(s.siHors)}</div>`;
  if(s.siNon&&s.type!=='contrôle') h+=`<div class="note warn small">Si non : ${inl(s.siNon)}</div>`;
  if(s.type==='minuterie') h+=`<div class="target">Durée : <b>${esc(s.dureeTxt||fmtDur(s.duree||0))}</b>${s.repeat?' – alerte périodique':''}</div>`;
  if(s.type==='checklist'&&ro) h+=`<div>${s.items.map(it=>`<div class="check"><span>☐</span><span>${inl(it)}</span></div>`).join('')}</div>`;
  return h+`</div>`;
}
function curTask(){ return CHP&&CHP.tasks.find(x=>x.id===curTid); }
function renderStep(){
  const t=curTask(); if(!t){ go('board'); return; }
  const st=taskState(t);
  if(st!=='mine'){ curTid=null; go('board'); return; }
  const pos=taskPos(t), f=t.steps[pos], s=f.step, res=(TS(t.id).results||{})[f.key], u=uiState;
  const others=(TS(t.id).ops||[]).filter(x=>x!==USER);
  header(`${s.num} ${s.title}`, `${t.title} · étape ${pos+1}/${t.steps.length}`, pos/t.steps.length);
  let h='';
  if(others.length) h+=`<div class="note small">👥 Tâche partagée avec <b>${others.map(esc).join(', ')}</b> – l’avancement est commun.</div>`;
  h+=stepBody(f,false,t);
  if(res) h+=`<div class="note ${res.status==='ok'?'ok':'warn'} small">Déjà validée par ${esc(res.by||'?')} à ${fmtT(res.at)}${res.value!==''?` – valeur ${esc(res.value)}`:''}${res.comment?` – « ${esc(res.comment)} »`:''}.</div>`;
  if(s.type==='checklist'){ u.checks=u.checks||(res&&res.checks)||s.items.map(()=>false);
    h+=`<div class="card">${s.items.map((it,k)=>`<label class="check"><input type="checkbox" data-chk="${k}" ${u.checks[k]?'checked':''}><span>${inl(it)}</span></label>`).join('')}</div>`; }
  if(s.type==='valeur') h+=`<div class="card"><label class="fld" for="fVal">Valeur mesurée</label><div class="valrow"><input class="inp" id="fVal" inputmode="decimal" autocomplete="off" value="${esc(u.val??'')}"><span class="unit">${esc(s.plage?.unit||'')}</span></div></div>`;
  if(s.type==='minuterie'){ const x=timerOf(t,f); if(x) h+=`<div class="card"><div class="countdown" id="cd" data-key="${esc(x.key)}">${x.due||x.acked?'00:00':fmtDur((x.endAt-Date.now())/1000)}</div>${x.due?'<div class="note bad">Temps écoulé</div>':''}</div>`; }
  if(u.problem) h+=`<div class="note bad">${inl(u.problem)}</div>`;
  if(u.needComment||s.type!=='info'){ const req=u.needComment&&s.commentReq;
    h+=`<label class="fld" for="fCom">${u.needComment?(req?'Commentaire (obligatoire)':'Commentaire sur l’anomalie (facultatif)'):'Remarque (facultatif)'}</label><textarea class="inp" id="fCom" placeholder="…">${esc(u.com??'')}</textarea>`; }
  h+=`<div class="btnrow noprint" style="margin-top:14px"><button class="btn ghost sm" data-act="board">‹ Tableau</button><button class="btn ghost sm" data-act="release">Relâcher la tâche</button></div>`;
  $('#app').innerHTML=h; setBar(stepActions(t,f));
}
function stepActions(t,f){
  const s=f.step,u=uiState,pos=taskPos(t),prev=pos>0?`<button class="btn ghost" data-act="prev" style="flex:0 0 30%">‹ Préc.</button>`:'';
  let main='';
  if(u.forceMode) return `<div class="btnrow">${prev}<button class="btn" data-act="retry">Corriger / refaire</button></div><button class="btn bad" data-act="force">Consigner l’anomalie et continuer</button>`;
  switch(s.type){
    case 'action': main=`<button class="btn ok" data-act="done">✓ Fait</button>`; break;
    case 'info': main=`<button class="btn primary" data-act="done">Suivant ›</button>`; break;
    case 'avertissement': main=`<button class="btn primary" data-act="done">⚠ Lu et compris</button>`; break;
    case 'contrôle': return `<div class="btnrow">${prev}<button class="btn bad" data-act="no">✗ Non</button><button class="btn ok" data-act="yes">✓ Oui</button></div>`;
    case 'valeur': main=`<button class="btn primary" data-act="val">Valider la valeur</button>`; break;
    case 'checklist': main=(u.checks||[]).every(Boolean)?`<button class="btn ok" data-act="chk">✓ Tout est coché</button>`:`<button class="btn" data-act="chkpart">Valider incomplet…</button>`; break;
    case 'minuterie': { const x=timerOf(t,f);
      if(!x) main=`<button class="btn primary" data-act="tstart">▶ Démarrer (${esc(s.dureeTxt||fmtDur(s.duree||0))})</button>`;
      else if(s.repeat) main=`<button class="btn ok" data-act="done">Continuer ›</button>`;
      else if(x.due||x.acked) main=`<button class="btn ok" data-act="tdone">✓ Terminé</button>`;
      else main=u.early?`<button class="btn bad" data-act="tdone">Confirmer validation anticipée</button>`:`<button class="btn" data-act="tearly">Valider avant la fin…</button>`;
      break; }
  }
  return `<div class="btnrow">${prev}${main}</div>`;
}

/* ---------- Séquencement (vue Gantt simplifiée) ---------- */
function renderLevels(){
  const P = CHP||PUB.parsed;
  const inCh = !!(CHP && CH);
  const maxL=Math.max(1,...P.tasks.map(t=>t.fin));
  header('Séquencement', `${P.tasks.length} tâches · niveaux 1 à ${maxL}`, null);
  const items=[['g-done','terminée'],['g-open','ouverte']].concat(inCh?[['g-mine','la mienne']]:[]).concat([['g-lock','à venir'],['g-empty','hors plage']]);
  $('#app').innerHTML=`<div class="card"><canvas id="ganttCv" style="display:block;width:100%"></canvas>
    <div class="glegend">${items.map(([k,l])=>`<span><canvas class="gsw" data-k="${k}" width="16" height="16" style="width:16px;height:16px;vertical-align:-3px;margin-right:5px"></canvas>${l}</span>`).join('')}</div></div>
    <div class="note small">Règle : une tâche s’ouvre quand toutes les tâches dont la <b>Fin</b> est inférieure à son <b>Début</b> sont validées.</div>`;

  drawGantt(P,inCh,maxL);

/* Graphe dessiné en canevas : couleurs exactes, insensibles à l'assombrissement automatique d'Android */
function drawGantt(P,inCh,maxL){
  const cv=$('#ganttCv'); if(!cv) return;
  const css=getComputedStyle(document.documentElement), v=n=>css.getPropertyValue(n).trim();
  const COL={'g-done':v('--g-done'),'g-open':v('--g-open'),'g-mine':v('--g-mine'),'g-lock':v('--g-lock'),'g-empty':v('--g-empty')};
  document.querySelectorAll('canvas.gsw').forEach(c=>{ const x=c.getContext('2d'); x.fillStyle=COL[c.dataset.k]; rr(x,0,0,16,16,3); x.fill(); });
  const dpr=window.devicePixelRatio||1, W=cv.parentElement.clientWidth-32;
  const font='13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif', fontH='bold 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const labelW=Math.min(Math.round(W*0.4),190), cellW=(W-labelW)/maxL, rowH=30, headH=22, gap=2;
  const H=headH+P.tasks.length*rowH;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.width=W+'px'; cv.style.height=H+'px';
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
  x.textBaseline='middle';
  x.font=fontH; x.fillStyle=v('--muted'); x.textAlign='left'; x.fillText('Tâche',0,headH/2);
  x.textAlign='center'; for(let i=0;i<maxL;i++) x.fillText(String(i+1), labelW+i*cellW+cellW/2, headH/2);
  P.tasks.forEach((t,r)=>{
    const y=headH+r*rowH, st=inCh?taskState(t):(t.debut===1?'free':'locked');
    const c = st==='done'?'g-done': st==='locked'?'g-lock': st==='mine'?'g-mine':'g-open';
    x.font=font; x.fillStyle=v('--fg'); x.textAlign='left';
    let s=t.title; const maxW=labelW-8; if(x.measureText(s).width>maxW){ while(s.length>1 && x.measureText(s+'…').width>maxW) s=s.slice(0,-1); s+='…'; }
    x.fillText(s,0,y+rowH/2);
    for(let i=0;i<maxL;i++){ const L=i+1, on=L>=t.debut&&L<=t.fin; x.fillStyle=COL[on?c:'g-empty']; rr(x,labelW+i*cellW+gap/2,y+gap/2,cellW-gap,rowH-gap,3); x.fill(); }
  });
}
function rr(x,a,b,w,h,r){ x.beginPath(); if(x.roundRect){ x.roundRect(a,b,w,h,r); } else { x.rect(a,b,w,h); } }
window.addEventListener('resize',()=>{ if(view==='phases') render(); });

function renderReport(){

    <b>Procédure :</b> ${esc(CH.procName)} – v${esc(CH.procVersion)} du ${esc(CH.procDate)}<br><b>Opérateurs :</b> ${Object.keys(CH.users||{}).map(esc).join(', ')}</p>
    <div style="overflow-x:auto"><table><thead><tr><th>Tâche</th><th>N°</th><th>Étape</th><th>Résultat</th><th>Valeur</th><th>Par</th><th>Heure</th><th>Commentaire</th></tr></thead><tbody>${rows}</tbody></table></div>
    <h3 style="margin-top:16px">Événements</h3><div style="overflow-x:auto"><table><tbody>${LOG.filter(e=>!e.num).map(e=>`<tr><td>${fmtD(e.t)} ${fmtT(e.t)}</td><td>${esc(e.by||'')}</td><td>${esc(e.status)}</td><td>${esc(e.title)}</td><td>${esc(e.comment)}</td></tr>`).join('')}</tbody></table></div></div>`;

function csvOf(){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const head=['Date','Heure','Opérateur','Tâche','Phase','Étape','Intitulé','Type','Résultat','Valeur','Unité','Commentaire'];
  const lines=[`${q('Chantier')};${q(CH.name)}`,`${q('Procédure')};${q(CH.procName+' v'+CH.procVersion+' ('+CH.procDate+')')}`,'',head.map(q).join(';')];
  LOG.forEach(e=>lines.push([fmtD(e.t),fmtT(e.t),e.by,e.task,e.phase,e.num,e.title,e.type,e.status,e.value,e.unit,e.comment].map(q).join(';')));
  return '﻿'+lines.join('\r\n');
}
async function exportCsv(){
  const name=`journal_J3D_${(CH.name||'chantier').replace(/[^\w-]+/g,'_')}_${fmtD(CH.createdAt).replace(/\//g,'-')}.csv`;
  const blob=new Blob([csvOf()],{type:'text/csv'});
  try{ const file=new File([blob],name,{type:'text/csv'}); if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

function closeMenu(){ $('#menu').classList.remove('open'); }
async function menuAction(el){
  const a=el.dataset.menu;
  if(a==='close'&&!el.dataset.confirm){ el.dataset.confirm='1'; el.textContent='✖ Confirmer la clôture (pour tous)'; return; }
  closeMenu();
  switch(a){
    case 'home': go('home'); break;
    case 'board': curTid=null; go('board'); break;
    case 'journal': go('journal'); break;
    case 'levels': go('phases'); break;
    case 'browse': view='browse'; uiState={}; render(); window.scrollTo(0,0); break;
    case 'leave': leaveChantier(); break;
    case 'close': await closeChantier(); go('journal'); break;
    case 'reload': try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}catch(e){} try{const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.update()));}catch(e){} location.reload(); break;
    case 'quit': releaseWake(); try{window.close();}catch(e){} setTimeout(()=>{go('home');toast('Fermer avec le bouton « Applications récentes » d’Android',4000);},300); break;
  }
}

  if(e.target.closest('#zoom')){ $('#zoom').style.display='none'; return; }
  if(e.target.closest('#btnMenu')){ readUi(); openMenu(); return; }
  const mi=e.target.closest('[data-menu]'); if(mi){ menuAction(mi); return; }
  if(e.target.id==='menu'){ closeMenu(); return; }
  const ack=e.target.closest('[data-ack]'); if(ack){ ackTimer(ack.dataset.ack); if(view==='step') render(); return; }
  const stp=e.target.closest('[data-stop]'); if(stp){ stopTimer(stp.dataset.stop); return; }
  const op=e.target.closest('[data-open]'); if(op){ openChantier(op.dataset.open,true); return; }
  const tk=e.target.closest('[data-take]'); if(tk){ ensureAudio(); takeTask(CHP.tasks.find(x=>x.id===tk.dataset.take)); return; }
  const ct=e.target.closest('[data-cont]'); if(ct){ curTid=ct.dataset.cont; go('step'); return; }
  const ro=e.target.closest('[data-reopen]'); if(ro){ if(!ro.dataset.confirm){ ro.dataset.confirm='1'; ro.textContent='Confirmer'; return; } reopenTask(CHP.tasks.find(x=>x.id===ro.dataset.reopen)); return; }
  const bg=e.target.closest('[data-bgo]'); if(bg){ uiState.i=+bg.dataset.bgo; render(); window.scrollTo(0,0); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  readUi(); ensureAudio();
  const act=b.dataset.act, t=curTask(), f=t&&t.steps[taskPos(t)], s=f&&f.step, u=uiState, com=(u.com||'').trim();
  switch(act){
    case 'setuser': { const n=$('#fUser').value.trim(); if(!n){ toast('Saisir votre nom'); return; } USER=n; if(!QS_USER) store.set(K.user,n); render(); return; }
    case 'chuser': USER=''; store.del(K.user); render(); return;
    case 'create': { const n=$('#fChantier').value.trim(); if(!n){ toast('Nom du chantier ?'); return; } askNotif(); createChantier(n); return; }
    case 'home': go('home'); return;
    case 'board': curTid=null; go('board'); return;
    case 'journal': go('journal'); return;
    case 'levels': go('phases'); return;
    case 'browse': view='browse'; uiState={}; render(); return;
    case 'blist': uiState.i=null; render(); return;
    case 'bprev': uiState.i--; render(); window.scrollTo(0,0); return;
    case 'bnext': uiState.i++; render(); window.scrollTo(0,0); return;
    case 'archives': go('archives'); return;
    case 'unlocal': store.del(K.local); toast('Procédure publiée rétablie'); { const pub=await loadPublished(); PUB={...pub,parsed:parseMD(pub.text)}; } render(); return;
    case 'install': if(deferredInstall){ deferredInstall.prompt(); deferredInstall=null; render(); } return;
    case 'release': releaseTask(t); return;
    case 'prev': if(taskPos(t)>0) setPos(t,taskPos(t)-1); return;
    case 'done': recordStep(t,f,'ok','',com); return;
    case 'yes': recordStep(t,f,'ok','oui',com); return;
    case 'no': u.problem=s.siNon||'Contrôle non conforme.'; u.forceMode=true; u.needComment=true; u.kind='non'; logEvt(t,f,'non conforme',s.title,'non',''); render(); return;
    case 'val': { const v=num(u.val); if(v===null){ toast('Saisir une valeur numérique'); return; } const pl=s.plage;
      if(!pl||(v>=pl.min&&v<=pl.max)){ recordStep(t,f,'ok',String(v),com); return; }
      u.problem=`Valeur ${v} ${pl.unit} hors plage (${plageTxt(pl)}). ${s.siHors||''}`; u.forceMode=true; u.needComment=true; u.kind='val'; u.forcedVal=String(v);
      logEvt(t,f,'non conforme',s.title,String(v),'hors plage'); render(); return; }
    case 'chk': recordStep(t,f,'ok',`${u.checks.length}/${u.checks.length}`,com,{checks:u.checks}); return;
    case 'chkpart': { const n=u.checks.filter(Boolean).length; u.problem=`Checklist incomplète : ${n}/${u.checks.length} élément(s) coché(s).`; u.forceMode=true; u.needComment=true; u.kind='chk'; render(); return; }
    case 'retry': u.problem=null; u.forceMode=false; u.needComment=false; render(); return;
    case 'force': { if(!com&&s.commentReq){ toast('Commentaire obligatoire pour cette étape'); $('#fCom')?.focus(); return; }
      const val=u.kind==='val'?u.forcedVal:u.kind==='non'?'non':u.kind==='chk'?`${u.checks.filter(Boolean).length}/${u.checks.length}`:'';
      recordStep(t,f,'forcé',val,com,u.kind==='chk'?{checks:u.checks}:null); return; }
    case 'tstart': startTimer(t,f); render(); return;
    case 'tearly': u.early=true; setBar(stepActions(t,f)); return;
    case 'tdone': { const x=timerOf(t,f), early=x&&!x.due&&!x.acked; if(x) stopTimer(x.key); recordStep(t,f,early?'forcé':'ok','',early?(com||'validée avant la fin de la minuterie'):com); return; }
    case 'csv': exportCsv(); return;
    case 'report': go('report'); return;
    case 'print': window.print(); return;
    case 'close': { if(!b.dataset.confirm){ b.dataset.confirm='1'; b.textContent='Confirmer (pour tous)'; return; } await closeChantier(); render(); return; }
  }
});
document.addEventListener('error',e=>{ const im=e.target; if(im&&im.tagName==='IMG'&&im.hasAttribute('data-zoom')){ const d=document.createElement('div'); d.className='imgmissing'; d.innerHTML='📷 Image à fournir :<br>'+esc(im.getAttribute('src')); im.replaceWith(d); } },true);
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; if(view==='home') render(); });
if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
setInterval(tick,1000);
init();
</script>
</body>
</html>
