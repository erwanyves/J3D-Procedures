<head>

<style>
:root{
  --bg:#f3f4f2; --card:#ffffff; --fg:#1b2127; --muted:#5d6872; --line:#d9ddd8;
  --accent:#d9650b; --accent-fg:#ffffff; --top:#1f2a33; --top-fg:#f3f4f2;
  --ok:#1f8a4c; --ok-bg:#e3f4ea; --warn:#a86400; --warn-bg:#fff1d6; --bad:#c0262d; --bad-bg:#fde4e4; --info-bg:#e9eef3;
  --bar:#3d7fe0; --bar-bg:#e2e6e9;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#12171b; --card:#1c2328; --fg:#eef1ef; --muted:#9aa6af; --line:#2f3a42;
  --accent:#f08a2c; --accent-fg:#1b1206; --top:#0b0f12; --top-fg:#eef1ef;
  --ok:#4cc583; --ok-bg:#163526; --warn:#f2b44a; --warn-bg:#3a2b10; --bad:#ff6b70; --bad-bg:#3d1a1c; --info-bg:#232c33;
  --bar:#6aa7ec; --bar-bg:#2f3a42; color-scheme:dark; } }
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--top);color:var(--top-fg);padding:12px 16px;position:sticky;top:0;z-index:5}
header .row{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
header h1{font-size:17px;margin:0} header .st{margin-left:auto;font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.14)}
header .st.bad{background:var(--bad);color:#fff}
nav{display:flex;gap:4px;max-width:1100px;margin:10px auto 0;overflow-x:auto}
nav button{background:transparent;border:0;color:var(--top-fg);opacity:.75;padding:7px 12px;border-radius:8px;white-space:nowrap;cursor:pointer}
nav button.on{opacity:1;background:rgba(255,255,255,.14);font-weight:600}
nav .n{font-size:11px;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:0 6px;margin-left:5px}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 4px} .card h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--info-bg);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.grp{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}
.grp .gh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--info-bg)}
.grp .gh b{flex:1;min-width:200px}
.grp .gb{padding:4px 12px 10px}
.occ{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px} .occ:last-child{border-bottom:0}
.act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.act select{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--card)}
.act textarea{flex:1;min-width:220px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--card);min-height:34px;resize:vertical}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted)}
input.f{width:100%;max-width:520px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--card)}
.note{background:var(--info-bg);border-radius:8px;padding:10px 12px;font-size:14px;margin:8px 0}
.note.warn{background:var(--warn-bg)} .note.bad{background:var(--bad-bg)} .note.ok{background:var(--ok-bg)}
.rng{position:relative;height:14px;background:var(--bar-bg);border-radius:4px;min-width:160px}
.rng i{position:absolute;top:3px;height:8px;background:var(--bar);border-radius:4px;opacity:.45}
.rng b{position:absolute;top:0;width:3px;height:14px;background:var(--bar);border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;background:var(--card)}
.chips input{margin-right:5px}
.pe-grid{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:12px;align-items:start}
@media (max-width:760px){ .pe-grid{grid-template-columns:1fr} }
.pe-tree{max-height:78vh;overflow:auto;padding:10px}
.pe-ph{margin-bottom:8px} .pe-row{display:flex;gap:6px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.pe-st{padding:4px 8px 4px 22px;border-radius:6px;cursor:pointer;font-size:14px}
.pe-row:hover,.pe-st:hover{background:var(--info-bg)} .pe-ph.on>.pe-row,.pe-st.on{background:var(--accent);color:var(--accent-fg)}
select.f,textarea.f{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--card);width:100%}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--top);color:var(--top-fg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
a{color:var(--bar)}
</style>

<body>
<header><div class="row"><h1>J3D · Administration</h1><span class="st" id="st">Connexion…</span></div>
<nav id="nav"></nav></header>
<main id="app"><div class="card muted">Chargement…</div></main>
<div id="toast"></div>
<script type="module">
/* =====================================================================
   Module d'administration J3D
   - Lit les chantiers dans Firebase (mêmes données que l'appli)
   - Dépose le journal CSV de chaque chantier clôturé dans un dépôt GitHub privé
     (jeton saisi ici, conservé uniquement dans ce navigateur)
   - Synthèse : anomalies, commentaires, durées, suivi des actions (collection « actions »)
   ===================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmtT=ms=>{const d=new Date(ms);return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;};
const fmtD=ms=>{const d=new Date(ms);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;};
const isoD=ms=>{const d=new Date(ms);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const fmtDur=ms=>{let s=Math.max(0,Math.round(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} h ${pad(m)}`:m?`${m} min`:`${s} s`;};
const toast=(m,d=2500)=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),d);};
const LS={get(k,d){try{const v=localStorage.getItem('j3dadm.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('j3dadm.'+k,JSON.stringify(v));}catch(e){}}};

let CFG=Object.assign({repo:'erwanyves/J3D-Chantiers',branch:'main',dir:'chantiers',token:'',admin:'',useGh:true,useDbx:true,dbxKey:'aspo2z7vkjlt036',dbxDir:'chantiers',dbxRefresh:''},LS.get('cfg',{}));
const useGh=()=>CFG.useGh&&!!CFG.token, useDbx=()=>CFG.useDbx&&!!CFG.dbxRefresh, canSend=()=>useGh()||useDbx();
const isCollected=c=>!!c.collected&&(!useGh()||!!c.collected.path)&&(!useDbx()||!!c.collected.dbx)&&canSend();
const destTxt=()=>[useGh()?`GitHub ${CFG.repo}`:'',useDbx()?'Dropbox':''].filter(Boolean).join(' et ')||'aucune destination';
let CH=[];          // chantiers {id,name,createdAt,closedAt,...,log:[]}
let ACT={};         // actions par id
let MNT={};         // maintenance : dernière réalisation par opération (collection « maintenance »)
let view=LS.get('view','chantiers');
let INCL=LS.get('incl',null);   // ids inclus dans la synthèse (null = tous les clôturés)
let DB=null;

/* ---------- Données : Firebase (ou maquette window.__MOCK pour les essais) ---------- */
async function connect(){
  if(window.__MOCK){ DB={mock:true}; return; }
  const cfg=await (await fetch('firebase-config.json',{cache:'no-cache'})).json();
  const B='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,F,Au]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
  const app=A.initializeApp(cfg); const auth=Au.getAuth(app); await Au.signInAnonymously(auth);
  DB={F,db:F.getFirestore(app)};
}
async function loadAll(){
  if(DB.mock){ CH=structuredClone(window.__MOCK.chantiers); ACT=structuredClone(window.__MOCK.actions||{}); MNT=structuredClone(window.__MOCK.maintenance||{}); return; }
  const {F,db}=DB;
  const docs=(await F.getDocs(F.collection(db,'chantiers'))).docs;
  CH=await Promise.all(docs.map(async d=>{ const c={id:d.id,...d.data()}; delete c.mdText;
    c.log=(await F.getDocs(F.query(F.collection(db,'chantiers',d.id,'log'),F.orderBy('t')))).docs.map(x=>x.data()); return c; }));
  ACT={}; (await F.getDocs(F.collection(db,'actions'))).docs.forEach(d=>ACT[d.id]={id:d.id,...d.data()});
  MNT={}; (await F.getDocs(F.collection(db,'maintenance'))).docs.forEach(d=>MNT[d.id]=d.data());
}
async function saveChantier(id,fields){
  const c=CH.find(x=>x.id===id); Object.assign(c,fields);
  if(DB.mock) return; const {F,db}=DB; await F.updateDoc(F.doc(db,'chantiers',id),fields);
}
async function saveMnt(id,data){ MNT[id]=data; if(DB.mock) return; const {F,db}=DB; await F.setDoc(F.doc(db,'maintenance',id),data); }
async function saveAction(a){
  ACT[a.id]=a; if(DB.mock) return; const {F,db}=DB; const {id,...rest}=a; await F.setDoc(F.doc(db,'actions',id),rest);
}

/* ---------- CSV (même format que l'export de l'appli) ---------- */
function csvOf(c){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const head=['Date','Heure','Opérateur','Tâche','Phase','Étape','Intitulé','Type','Résultat','Valeur','Unité','Commentaire'];
  const lines=[`${q('Chantier')};${q(c.name)}`,`${q('Procédure')};${q((c.procName||'')+' v'+(c.procVersion||'?')+' ('+(c.procDate||'')+')')}`,
    `${q('Début')};${q(fmtD(c.createdAt)+' '+fmtT(c.createdAt))}`,`${q('Clôture')};${q(c.closedAt?fmtD(c.closedAt)+' '+fmtT(c.closedAt):'')}`,
    `${q('Identifiant')};${q(c.id)}`,'',head.map(q).join(';')];
  (c.log||[]).slice().sort((a,b)=>a.t-b.t).forEach(e=>lines.push([fmtD(e.t),fmtT(e.t),e.by,e.task,e.phase,e.num,e.title,e.type,e.status,e.value,e.unit,e.comment].map(q).join(';')));
  return '﻿'+lines.join('\r\n');
}
const safeName=s=>String(s||'chantier').normalize('NFC').replace(/[\\/:*?"<>|#%{}^~\[\]`]+/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^[-.]+|[-.]+$/g,'')||'chantier';
const fileBase=c=>`${isoD(c.createdAt)}-${safeName(c.name)}`;
function download(name,text,type='text/csv'){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); }

/* ---------- GitHub ---------- */
const b64=t=>{ const u=new TextEncoder().encode(t); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode(...u.subarray(i,i+0x8000)); return btoa(s); };
const encPath=p=>p.split('/').map(encodeURIComponent).join('/');
async function gh(path,opt={}){
  if(!CFG.token) throw new Error('Jeton GitHub non renseigné (onglet Réglages)');
  const r=await fetch(`https://api.github.com/repos/${CFG.repo}/${path}`,{...opt,headers:{'Accept':'application/vnd.github+json','Authorization':`Bearer ${CFG.token}`,'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});
  if(r.status===404) return null;
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(`GitHub ${r.status} : ${j.message||r.statusText}`);
  return j;
}
const contentUrl=p=>`contents/${encPath(p)}`;
/* ---------- Dropbox (OAuth PKCE, dossier d'application « Applications/J3D ») ---------- */
const DBX_REDIRECT=()=>location.origin+location.pathname;
const b64url=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function dbxConnect(){
  if(!CFG.dbxKey) throw new Error('App key Dropbox manquante');
  const v=b64url(crypto.getRandomValues(new Uint8Array(48))), st=b64url(crypto.getRandomValues(new Uint8Array(16)));
  const ch=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  LS.set('pkce',{v,st});
  location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:CFG.dbxKey,response_type:'code',code_challenge:ch,code_challenge_method:'S256',token_access_type:'offline',redirect_uri:DBX_REDIRECT(),state:st});
}
async function dbxCallback(){
  const q=new URLSearchParams(location.search); if(!q.get('code')&&!q.get('error')) return false;
  history.replaceState(null,'',DBX_REDIRECT()); view='reglages';
  if(q.get('error')){ toast('Dropbox : autorisation refusée',4000); return true; }
  const pk=LS.get('pkce',null); LS.set('pkce',null);
  if(!pk||pk.st!==q.get('state')){ toast('Dropbox : réponse inattendue, recommencer la connexion',5000); return true; }
  const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams({code:q.get('code'),grant_type:'authorization_code',code_verifier:pk.v,client_id:CFG.dbxKey,redirect_uri:DBX_REDIRECT()})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.refresh_token){ toast('Dropbox : échec de la connexion ('+(j.error_description||j.error||r.status)+')',6000); return true; }
  CFG.dbxRefresh=j.refresh_token; CFG.useDbx=true; LS.set('cfg',CFG); DBXTOK={t:j.access_token,exp:Date.now()+(j.expires_in||14400)*1000-60000};
  toast('Dropbox connecté',3000); return true;
}
let DBXTOK=null;
async function dbxToken(){
  if(DBXTOK&&DBXTOK.exp>Date.now()) return DBXTOK.t;
  if(!CFG.dbxRefresh) throw new Error('Dropbox non connecté (onglet Réglages)');
  const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams({grant_type:'refresh_token',refresh_token:CFG.dbxRefresh,client_id:CFG.dbxKey})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error('Dropbox : '+(j.error_description||j.error||r.status)+' – reconnecter dans Réglages');
  DBXTOK={t:j.access_token,exp:Date.now()+(j.expires_in||14400)*1000-60000}; return DBXTOK.t;
}
const hdrJson=o=>JSON.stringify(o).replace(/[\u007f-\uffff]/g,c=>'\\u'+('000'+c.charCodeAt(0).toString(16)).slice(-4));
async function dbxRpc(ep,arg){
  const r=await fetch('https://api.dropboxapi.com/2/'+ep,{method:'POST',headers:{Authorization:'Bearer '+await dbxToken(),'Content-Type':'application/json'},body:JSON.stringify(arg)});
  const j=await r.json().catch(()=>({}));
  if(r.status===409) return {__conflict:j}; if(!r.ok) throw new Error('Dropbox '+r.status+' : '+(j.error_summary||j.error||''));
  return j;
}
async function dbxUpload(path,text){
  const r=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{Authorization:'Bearer '+await dbxToken(),'Content-Type':'application/octet-stream','Dropbox-API-Arg':hdrJson({path,mode:'overwrite',mute:true})},body:new TextEncoder().encode(text)});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error('Dropbox '+r.status+' : '+(j.error_summary||''));
  return j;
}
async function pushDropbox(c,csv){
  let path=c.collected?.dbx;
  if(!path){ const base=`/${CFG.dbxDir.replace(/^\/+|\/+$/g,'')}/${fileBase(c)}`;
    for(let k=1;k<50;k++){ const p=k===1?`${base}.csv`:`${base}-${k}.csv`; const m=await dbxRpc('files/get_metadata',{path:p}); if(m.__conflict){ path=p; break; } }
    if(!path) throw new Error('Trop de fichiers homonymes'); }
  await dbxUpload(path,csv); return path;
}
async function pushChantier(c){
  if(!canSend()) throw new Error('Aucune destination configurée (onglet Réglages)');
  const csv=csvOf(c), col={...(c.collected||{})};
  if(useDbx()) col.dbx=await pushDropbox(c,csv);
  if(useGh()){ const p=await pushGithub(c,csv); col.path=p.path; col.url=p.url; }
  col.at=Date.now(); col.logCount=(c.log||[]).length;
  await saveChantier(c.id,{collected:col});
  return [col.dbx?'Dropbox '+col.dbx:'',useGh()?'GitHub '+col.path:''].filter(Boolean).join(' · ');
}
async function pushGithub(c,csv){
  let path=c.collected?.path, sha=null;
  if(path){ const ex=await gh(contentUrl(path)+`?ref=${CFG.branch}`); sha=ex?.sha||null; }
  else { // nouveau fichier : AAAA-MM-JJ-Nom.csv, suffixe -2, -3… si le nom est déjà pris par un autre chantier
    const base=`${CFG.dir.replace(/\/+$/,'')}/${fileBase(c)}`;
    for(let k=1;k<50;k++){ const p=k===1?`${base}.csv`:`${base}-${k}.csv`; const ex=await gh(contentUrl(p)+`?ref=${CFG.branch}`); if(!ex){ path=p; break; } }
    if(!path) throw new Error('Trop de fichiers homonymes');
  }
  const body={message:`Chantier ${c.name} (${fmtD(c.createdAt)})${c.closedAt?'':' – non clôturé'}`,content:b64(csv),branch:CFG.branch};
  if(sha) body.sha=sha;
  const j=await gh(contentUrl(path),{method:'PUT',body:JSON.stringify(body)});
  return {path,url:j?.content?.html_url||''};
}

/* ---------- Synthèse ---------- */
const inclIds=()=>INCL||CH.filter(c=>c.closedAt).map(c=>c.id);
const inclCh=()=>{ const s=new Set(inclIds()); return CH.filter(c=>s.has(c.id)); };
const stepKey=(phase,title)=>`${phase||'—'} › ${title||'—'}`;
function hashId(s){ let h=5381; for(const ch of s) h=((h<<5)+h+ch.codePointAt(0))>>>0; return 'a'+h.toString(36); }
const AUTO_COMMENTS=new Set(['hors plage','démarrée','alerte périodique démarrée','validée avant la fin de la minuterie']);
function synth(){
  const groups={};   // clé étape → {key,phase,title,anoms:[],comments:[],last}
  const G=(e)=>{ const k=stepKey(e.phase,e.title); return groups[k]||(groups[k]={key:k,id:hashId(k),phase:e.phase,title:e.title,anoms:[],comments:[],last:0}); };
  const durs={};     // tâche → [{c,ms}]
  inclCh().forEach(c=>{
    const L=(c.log||[]).slice().sort((a,b)=>a.t-b.t);
    anomsOf(c).forEach(o=>{ const g=G(o.e); g.anoms.push(o); g.last=Math.max(g.last,o.e.t); });
    L.forEach(e=>{
      if(e.type==='événement') return;
      if(e.comment&&!AUTO_COMMENTS.has(e.comment)&&(e.status==='ok'||e.status==='forcé')){ const g=G(e); g.comments.push({c,e}); g.last=Math.max(g.last,e.t); }
    });
    const start={},end={};
    L.forEach(e=>{ if(e.type!=='événement'||!e.task) return; if(e.status==='prise'&&start[e.task]==null) start[e.task]=e.t; if(e.status==='terminée') end[e.task]=e.t; });
    Object.keys(end).forEach(t=>{ if(start[t]!=null&&end[t]>=start[t]) (durs[t]||(durs[t]=[])).push({c,ms:end[t]-start[t],start:start[t]-c.createdAt}); });
  });
  return {groups:Object.values(groups),durs};
}
/* Anomalies d'un chantier : « forcé », ou « non conforme » non suivi d'un « forcé » sur la même étape
   (un non conforme puis forcé = un seul incident, compté en « forcée ») */
function anomsOf(c){
  const L=(c.log||[]).slice().sort((a,b)=>a.t-b.t), out=[];
  L.forEach((e,i)=>{
    if(e.type==='événement') return;
    if(e.status==='forcé') out.push({c,e,kind:'forcée'});
    else if(e.status==='non conforme'){
      const nxt=L.slice(i+1).find(x=>x.phase===e.phase&&x.title===e.title&&(x.status==='ok'||x.status==='forcé'));
      if(!nxt||nxt.status==='ok') out.push({c,e,kind:nxt?'corrigée après reprise':'non conforme'});
    }
  });
  return out;
}
const critTag=g=>{ const c=[...g.anoms,...g.comments].map(o=>o.e.crit).find(x=>x==='sécurité')||[...g.anoms,...g.comments].map(o=>o.e.crit).find(Boolean);
  return c?`<span class="tag ${c==='sécurité'?'bad':c==='machine'?'warn':''}">${c==='sécurité'?'⛑':c==='machine'?'⚙':'◎'} ${esc(c)}</span>`:''; };
const ST=['à traiter','en cours','traité','sans suite'];
const stTag=s=>`<span class="tag ${s==='traité'?'ok':s==='en cours'?'warn':s==='sans suite'?'':'bad'}">${esc(s)}</span>`;
function actionOf(g){ return ACT[g.id]||{id:g.id,key:g.key,phase:g.phase,title:g.title,status:'à traiter',note:'',updatedAt:0,updatedBy:''}; }
const isNew=(g,a)=>(a.status==='traité'||a.status==='sans suite')&&a.updatedAt&&g.last>a.updatedAt;
function actionCtl(g){
  const a=actionOf(g);
  return `<div class="act" data-aid="${g.id}"><select data-k="status">${ST.map(s=>`<option${s===a.status?' selected':''}>${s}</option>`).join('')}</select>
    <textarea data-k="note" rows="1" placeholder="Action décidée, responsable, échéance…">${esc(a.note)}</textarea>
    ${a.updatedAt?`<span class="small muted">${esc(a.updatedBy||'')} · ${fmtD(a.updatedAt)}</span>`:''}${isNew(g,a)?'<span class="tag bad">nouvelle occurrence</span>':''}</div>`;
}
const occLine=(c,e,extra='')=>`<div class="occ"><b>${esc(c.name)}</b> <span class="muted small">${fmtD(e.t)} ${fmtT(e.t).slice(0,5)} · ${esc(e.by||'?')}</span>${extra}

function compteur(){
  let best=null;
  CH.forEach(c=>(c.log||[]).forEach(e=>{ if(e.title==='Compteur horaire'&&(e.status==='ok'||e.status==='forcé')){ const v=parseFloat(String(e.value).replace(',','.')); if(!isNaN(v)&&(!best||v>best.h)) best={h:v,at:e.t,src:c.name}; } }));
  const man=MNT._compteur; if(man&&(!best||man.h>=best.h)) best={h:man.h,at:man.at,src:'saisie admin'};
  return best;
}
const addMonths=(t,m)=>{ const d=new Date(t); d.setMonth(d.getMonth()+m); return d.getTime(); };
function mntState(id,o){
  const cur=compteur(), r=MNT[id]||{}, out={};
  if(o.h){ const due=(r.lastH!=null?r.lastH+o.h:(o.first||o.h)); out.dueH=due; if(cur){ out.leftH=due-cur.h; } }
  if(o.m&&r.lastAt){ out.dueAt=addMonths(r.lastAt,o.m); out.leftD=(out.dueAt-Date.now())/864e5; }
  const late=(out.leftH!=null&&out.leftH<0)||(out.leftD!=null&&out.leftD<0);
  const soon=!late&&((out.leftH!=null&&out.leftH<=Math.max(10,(o.h||0)*0.1))||(out.leftD!=null&&out.leftD<=15));
  out.st=(r.lastH==null&&!r.lastAt)?'unknown':late?'late':soon?'soon':(o.m&&!o.h&&!r.lastAt)?'unknown':'ok';
  return out;
}
const mntCount=()=>MPLAN.filter(([id,,,o])=>['late','soon'].includes(mntState(id,o).st)).length;
function rMaintenance(){
  const cur=compteur();
  const tag={late:'<span class="tag bad">en retard</span>',soon:'<span class="tag warn">bientôt</span>',ok:'<span class="tag ok">à jour</span>',unknown:'<span class="tag">jamais enregistrée</span>'};
  const rows=MPLAN.map(([id,cat,lbl,o])=>{ const r=MNT[id]||{}, x=mntState(id,o);
    const per=[o.h?(o.first?`${o.first} h puis ${o.h} h`:`${o.h} h`):'',o.m?(o.m>=12?`${o.m/12} an${o.m>12?'s':''}`:`${o.m} mois`):''].filter(Boolean).join(' ou ')+(o.mat?' *':'');
    let ech=[x.dueH!=null?`${x.dueH} h${x.leftH!=null?` (${x.leftH>=0?'reste '+Math.round(x.leftH):'dépassé de '+Math.round(-x.leftH)} h)`:''}`:'',x.dueAt?`${fmtD(x.dueAt)}`:''].filter(Boolean).join(' · ');
    if(x.st==='unknown') ech='à initialiser';
    return {k:{late:0,soon:1,unknown:2,ok:3}[x.st],html:`<tr><td><b>${esc(lbl)}</b><div class="small muted">${esc(cat)}</div></td><td class="small">${per}</td>
      <td class="small">${r.lastH!=null||r.lastAt?`${r.lastH!=null?r.lastH+' h':''}${r.lastAt?' · '+fmtD(r.lastAt):''}${r.by?' · '+esc(r.by):''}`:'—'}</td><td class="small">${ech||'—'}</td><td>${tag[x.st]}</td>
      <td style="white-space:nowrap"><button class="btn" data-mdone="${id}"${cur||!o.h?'':' disabled'}>Fait</button></td></tr>`}; }).sort((a,b)=>a.k-b.k).map(r=>r.html).join('');
  return `<div class="card"><h2>Maintenance</h2>
    <div class="muted small">Échéances du plan constructeur. Le compteur horaire vient de l’étape « Compteur horaire » des chantiers (Configuration IHM), ou d’une saisie ici. « Fait » enregistre l’opération au compteur actuel (ou aux heures saisies dans le champ, pour reprendre un entretien passé) et à la date du jour (collection Firebase <code>maintenance</code>).</div>
    <div class="bar" style="margin-top:10px"><span>Compteur actuel : <b>${cur?cur.h+' h':'inconnu'}</b>${cur?` <span class="small muted">(${esc(cur.src)}, ${fmtD(cur.at)})</span>`:''}</span>
      <input class="f" id="mH" type="number" step="0.1" min="0" placeholder="heures" style="width:110px"><button class="btn" data-act="setCompteur">Saisir le compteur</button></div></div>

/* =====================================================================
   Éditeur de procédure (onglet « Procédure »)
   - Charge procedure_J3D.md depuis GitHub, l'édite (mode guidé ou texte),
     le contrôle avec le même parseur que l'appli, puis le publie (commit).
   - Modèle par lignes : rien n'est réécrit hors des champs modifiés
     (les commentaires <!-- --> et les lignes inconnues sont conservés).
   ===================================================================== */
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<em>$2</em>');
const noAcc=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n;};
const CRIT={securite:'sécurité',machine:'machine',qualite:'qualité'};
const CRIT_UI={'sécurité':['crit-securite','⛑','Sécurité'],'machine':['crit-machine','⚙','Machine'],'qualité':['crit-qualite','◎','Qualité']};
const critBadge=c=>c&&CRIT_UI[c]?`<span class="crit ${CRIT_UI[c][0]}">${CRIT_UI[c][1]} ${CRIT_UI[c][2]}</span>`:'';
const critIcon=c=>c&&CRIT_UI[c]?`<span class="ci" title="${CRIT_UI[c][2]}">${CRIT_UI[c][1]}</span>`:'';
const TYPES={action:'action',controle:'contrôle',valeur:'valeur',avertissement:'avertissement',minuterie:'minuterie',checklist:'checklist',info:'info'};
function parseDuree(v){const m=noAcc(v).match(/([\d.,]+)\s*(h|min|mn|m|s)?/);if(!m)return null;const n=num(m[1]),u=m[2]||'min';return u==='h'?n*3600:u==='s'?n:n*60;}
function parsePlage(v){
  const N='(-?\\d+(?:[.,]\\d+)?)';
  let t=String(v).trim().replace(/^(?:de|entre|from|between)\s+/i,''); let m;
  if((m=t.match(new RegExp('^'+N+'\\s*(?:\\.\\.\\.?|à|a|et|-|–|—|to|/)\\s*'+N+'\\s*(.*)$','i')))) return {min:num(m[1]),max:num(m[2]),unit:m[3].trim()};
  if((m=t.match(new RegExp('^'+N+'\\s*(?:±|\\+/-|\\+-)\\s*'+N+'\\s*(.*)$')))) return {min:num(m[1])-num(m[2]),max:num(m[1])+num(m[2]),unit:m[3].trim()};
  if((m=t.match(new RegExp('^(?:<=?|≤|max(?:i(?:mum)?)?\\.?|inf[ée]rieur(?:e)?\\s+(?:ou\\s+[ée]gal(?:e)?\\s+)?[àa]|jusqu.[àa])\\s*'+N+'\\s*(.*)$','i')))) return {min:-Infinity,max:num(m[1]),unit:m[2].trim()};
  if((m=t.match(new RegExp('^(?:>=?|≥|min(?:i(?:mum)?)?\\.?|sup[ée]rieur(?:e)?\\s+(?:ou\\s+[ée]gal(?:e)?\\s+)?[àa]|au\\s+moins)\\s*'+N+'\\s*(.*)$','i')))) return {min:num(m[1]),max:Infinity,unit:m[2].trim()};
  if((m=t.match(new RegExp('^'+N+'\\s*(.*?)\\s*(mini?|minimum|maxi?|maximum)\\.?$','i')))){const isMin=/^min/i.test(m[3]);return isMin?{min:num(m[1]),max:Infinity,unit:m[2].trim()}:{min:-Infinity,max:num(m[1]),unit:m[2].trim()};}
  if((m=t.match(new RegExp('^'+N+'\\s*([^\\d]*)$')))) return {min:num(m[1]),max:num(m[1]),unit:m[2].trim()};
  return null;
}
function plageTxt(pl){const u=pl.unit?' '+pl.unit:'';if(pl.min===-Infinity)return `≤ ${pl.max}${u}`;if(pl.max===Infinity)return `≥ ${pl.min}${u}`;if(pl.min===pl.max)return `${pl.min}${u}`;return `${pl.min} à ${pl.max}${u}`;}
function parseMD(text){
  const warnings=[],meta={},phases=[];
  let src=String(text||'').replace(/\r\n?/g,'\n').replace(/<!--[\s\S]*?-->/g,m=>m.replace(/[^\n]/g,''));
  const lines=src.split('\n'); let i=0;
  if(lines[0]&&lines[0].trim()==='---'){i=1;while(i<lines.length&&lines[i].trim()!=='---'){const m=lines[i].match(/^\s*([^:]+?)\s*:\s*(.*)$/);if(m)meta[noAcc(m[1])]=m[2].trim();i++;}i++;}
  let ph=null,st=null;
  for(;i<lines.length;i++){
    const raw=lines[i],ln=i+1,l=raw.trim(); if(!l) continue; let m;
    if((m=raw.match(/^#\s+(.+)$/))){ph={name:m[1].replace(/^Phase\s*:\s*/i,'').trim(),line:ln,steps:[],text:[],notes:[]};phases.push(ph);st=null;continue;}
    if((m=raw.match(/^##\s+(.+)$/))){
      if(!ph){warnings.push({line:ln,msg:'Étape avant toute phase'});ph={name:'(sans phase)',line:ln,steps:[],text:[],notes:[]};phases.push(ph);}
      const t=m[1].trim(),mm=t.match(/^(\d+(?:\.\d+)*[a-z]?)\s+(.+)$/i);
      st={num:mm?mm[1]:'',title:mm?mm[2]:t,type:'action',typeSet:false,line:ln,text:[],notes:[],items:[],images:[]};ph.steps.push(st);continue;}
    if(/^#{3,}\s/.test(raw)){warnings.push({line:ln,msg:'Titre ### non géré (utiliser # pour une phase, ## pour une étape)'});continue;}
    if(!ph) continue;
    const tgt=st||ph;
    if((m=l.match(/^([A-Za-zÀ-ÿ ]+?)\s*:\s*(.*)$/))){
      const k=noAcc(m[1]),v=m[2].trim();let used=true;
      switch(k){
        case 'type':{const t=TYPES[noAcc(v)];if(st){if(t){st.type=t;st.typeSet=true;}else warnings.push({line:ln,msg:`Type inconnu « ${v} »`});}break;}
        case 'plage':{const pl=parsePlage(v);if(pl&&st)st.plage=pl;else warnings.push({line:ln,msg:`Plage illisible « ${v} » (ex. : 7..9 bar, de 0 à 13 cm, 28 ±1 cm, ≥ 45 °, 13 cm max)`});break;}
        case 'duree':{const d=parseDuree(v);if(d===null)warnings.push({line:ln,msg:`Durée illisible « ${v} »`});tgt.duree=d;tgt.dureeTxt=v;break;}
        case 'si non':tgt.siNon=v;break;
        case 'si hors plage':tgt.siHors=v;break;
        case 'operateurs':tgt.operateurs=v;break;
        case 'role':tgt.role=v;break;
        case 'note':tgt.notes.push(v);break;
        case 'repeter':tgt.repeat=/^(oui|yes|true|1)/i.test(noAcc(v));break;
        case 'commentaire':tgt.commentReq=/oblig/i.test(noAcc(v));break;
        case 'criticite':{const c=CRIT[noAcc(v)];if(c)tgt.crit=c;else warnings.push({line:ln,msg:`Criticité inconnue « ${v} » (sécurité, machine ou qualité)`});break;}
        case 'debut':{const n=parseInt(v,10);if(isNaN(n))warnings.push({line:ln,msg:`Début illisible « ${v} »`});else tgt.debut=n;break;}
        case 'fin':{const n=parseInt(v,10);if(isNaN(n))warnings.push({line:ln,msg:`Fin illisible « ${v} »`});else tgt.fin=n;break;}
        default:used=false;
      }
      if(used) continue;
    }
    if((m=l.match(/^[-*]\s+\[[ xX]\]\s+(.+)$/))){if(st)st.items.push(m[1]);else warnings.push({line:ln,msg:'Case à cocher hors étape'});continue;}
    if((m=l.match(/^!\[([^\]]*)\]\(\s*([^)\s]+)\s*\)/))){if(st)st.images.push({alt:m[1],src:m[2]});else warnings.push({line:ln,msg:'Image hors étape'});continue;}
    tgt.text.push(l.replace(/^[-*]\s+/,'• '));
  }
  phases.forEach(p=>{
    if(p.fin!=null&&p.debut!=null&&p.fin<p.debut) warnings.push({line:p.line,msg:`Phase « ${p.name} » : Fin < Début`});
    p.steps.forEach(s=>{
      const lbl=`Étape « ${s.title} »`;
      if(!s.typeSet) warnings.push({line:s.line,msg:`${lbl} : pas de « Type: » (action par défaut)`});
      if(s.type==='valeur'&&!s.plage) warnings.push({line:s.line,msg:`${lbl} : Type valeur sans Plage`});
      if(s.type==='minuterie'&&!s.duree) warnings.push({line:s.line,msg:`${lbl} : minuterie sans Durée`});
      if(s.type==='checklist'&&!s.items.length) warnings.push({line:s.line,msg:`${lbl} : checklist sans case « - [ ] »`});
    });
  });
  /* Numéros d'étape facultatifs dans le MD et ignorés : référence automatique <n° phase>.<n° étape>
     (journal, CSV, rapport) ; non affichée à l'écran, l'ordre suffit. */
  phases.forEach((p,pi)=>{ p.num=pi+1; p.steps.forEach((s,si)=>{ s.num=`${pi+1}.${si+1}`; }); });
  const flat=[];phases.forEach((p,pi)=>p.steps.forEach((s,si)=>flat.push({p:pi,s:si,key:`s${pi}_${si}`,phase:p,step:s})));
  if(!flat.length) warnings.push({line:0,msg:'Aucune étape trouvée'});
  const tasks=buildTasks(phases);
  return {meta,phases,flat,tasks,warnings};
}
/* Tâches : une phase = une tâche ; une étape portant Début/Fin devient une tâche indépendante.
   Sans Début/Fin, une tâche prend le niveau suivant la précédente (enchaînement simple). */
function buildTasks(phases){
  const tasks=[]; let last=0;
  const mk=(id,title,ph,steps,src)=>{
    const debut = src.debut ?? (last+1);
    const fin = Math.max(debut, src.fin ?? debut);
    const ops = Math.max(1, parseInt(src.operateurs ?? ph.operateurs ?? 1,10) || 1);
    const t={id,title,phase:ph,steps,debut,fin,ops,role:src.role||ph.role||''};
    tasks.push(t); last=fin; return t;
  };
  phases.forEach((ph,pi)=>{
    const rest=[];
    ph.steps.forEach((st,si)=>{
      const f={p:pi,s:si,key:`s${pi}_${si}`,phase:ph,step:st};
      if(st.debut!=null) mk(`t${pi}_${si}`,st.title,ph,[f],st);
      else rest.push(f);
    });
    if(rest.length) mk(`t${pi}`,ph.name,ph,rest,ph);
  });
  return tasks;
}


const PROC_REPO='erwanyves/J3D-Procedures', PROC_PATH='procedure_J3D.md';
let PROC={loaded:false,src:null,sha:null,text:'',model:null,sel:null,mode:LS.get('peMode','guide'),changes:[],parsed:null,busy:false};

/* ---------- modèle par lignes ---------- */
function mdModel(text){
  const L=text.split('\n'), m={head:[],phases:[]}; let inC=false, ph=null, st=null;
  for(const line of L){

    if(!inC&&line.includes('<!--')&&!line.slice(line.indexOf('<!--')).includes('-->')) inC=true; else if(inC&&line.includes('-->')) inC=false;
    if(isH){ ph={title:line,body:[],steps:[]}; m.phases.push(ph); st=null; continue; }
    if(isS&&ph){ st={title:line,lines:[]}; ph.steps.push(st); continue; }
    (st?st.lines:ph?ph.body:m.head).push(line);
  }
  return m;
}
const mdText=m=>[...m.head,...m.phases.flatMap(p=>[p.title,...p.body,...p.steps.flatMap(s=>[s.title,...s.lines])])].join('\n');

  if(t.startsWith('<!--')){ if(!t.includes('-->')) inC=true; return 'comment'; }
  if(!t) return 'blank';
  const k=t.match(/^([A-Za-zÀ-ÿ ]+?)\s*:\s*(.*)$/); if(k&&KEYS[noAcc(k[1])]) return 'key:'+noAcc(k[1]);
  if(/^[-*]\s+\[[ xX]\]\s+/.test(t)) return 'item';

const keyVal=l=>l.trim().replace(/^[^:]+:\s*/,'');
function getKey(lines,k){ const K=lineKinds(lines), i=K.indexOf('key:'+k); return i<0?'':keyVal(lines[i]); }
function lastIdx(K,pred){ for(let i=K.length-1;i>=0;i--) if(pred(K[i])) return i; return -1; }
function setKey(lines,k,v){ const K=lineKinds(lines), i=K.indexOf('key:'+k); v=String(v??'').trim();

  if(!v) return; const j=lastIdx(K,x=>x.startsWith('key:')); lines.splice(j+1,0,`${KEYS[k]}: ${v}`); }

  if(!vals.length) return;
  if(pos<0){ const K2=lineKinds(lines); pos=kind==='text'||kind==='key:note'?lastIdx(K2,x=>x.startsWith('key:'))+1:endPos(lines); }
  lines.splice(pos,0,...vals.map(fmt)); }

const b64dec=c=>new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\n/g,'')),ch=>ch.charCodeAt(0)));

    ${area('Notes encadrées (une par ligne)','notes',getNotes(b).join('\n'),'',2)}
    ${commentsOf(b)}
    <div class="small muted" style="margin-top:8px">${p.steps.length} étape(s). Règle : la phase s’ouvre quand toutes les tâches dont la Fin est inférieure à son Début sont validées.</div></div>`;
}
function rStepForm(pi,si){
  const p=PROC.model.phases[pi], s=p.steps[si], L=s.lines, type=noAcc(getKey(L,'type'))||'action', T=TYPES[type]||'action', crit=noAcc(getKey(L,'criticite'));
  const items=getItems(L), imgs=getGroup(L,'image');
  const show=(t,html)=>t?html:'';
  return `<div class="card"><div class="bar" style="margin-top:0"><h2 style="flex:1">${esc(phaseName(p))} › étape ${si+1}</h2>
      <button class="btn" data-pe="moveStep" data-d="-1"${si?'':' disabled'}>↑</button><button class="btn" data-pe="moveStep" data-d="1"${si<p.steps.length-1?'':' disabled'}>↓</button>
      <button class="btn" data-pe="addStep" data-at="after">+ Étape après</button><button class="btn" data-pe="dupStep">Dupliquer</button><button class="btn" data-pe="delStep">Supprimer</button></div>
    ${fld('Intitulé','stitle',stepName(s))}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 12px">
      <div><label class="f">Type</label><select class="f" data-pf="type">${TYPE_LIST.map(x=>`<option${x===T?' selected':''}>${x}</option>`).join('')}</select></div>
      <div><label class="f">Criticité</label><select class="f" data-pf="criticite"><option value="">—</option>${['sécurité','machine','qualité'].map(x=>`<option${noAcc(x)===crit?' selected':''}>${x}</option>`).join('')}</select></div>
      ${fld('Opérateurs','operateurs',getKey(L,'operateurs'))}${fld('Rôle','role',getKey(L,'role'))}
      ${show(T==='valeur',fld('Plage','plage',getKey(L,'plage'),'7..9 bar, ≥ 2,5 bar, 13 cm max'))}
      ${show(T==='minuterie',fld('Durée','duree',getKey(L,'duree'),'8 min'))}
      ${show(T==='minuterie',`<div><label class="f">Alerte périodique</label><select class="f" data-pf="repeter"><option value="">non</option><option${/^o/i.test(getKey(L,'repeter'))?' selected':''}>oui</option></select></div>`)}
      <div><label class="f">Commentaire en cas d’anomalie</label><select class="f" data-pf="commentaire"><option value="">facultatif</option><option${/oblig/i.test(getKey(L,'commentaire'))?' selected':''} value="obligatoire">obligatoire</option></select></div>
      ${fld('Tâche indépendante : Début','debut',getKey(L,'debut'),'vide = suit la phase')}${fld('Fin','fin',getKey(L,'fin'))}</div>
    ${show(T==='contrôle',fld('Si non (conduite à tenir)','sinon',getKey(L,'si non'),'ARRÊT – …'))}
    ${show(T==='valeur',fld('Si hors plage (conduite à tenir)','sihors',getKey(L,'si hors plage')))}
    ${area('Consigne (une ligne par paragraphe)','texts',getTexts(L).join('\n'),'',3)}
    ${area('Notes encadrées (une par ligne)','notes',getNotes(L).join('\n'),'',2)}
    ${T==='checklist'||items.length?`<label class="f">Cases à cocher (${items.length})</label><div id="peItems">${items.map((x,k)=>`<div class="bar" style="margin:3px 0"><input class="f" data-item="${k}" value="${esc(x)}" style="flex:1;max-width:none">
        <button class="btn" data-pe="itemMove" data-k="${k}" data-d="-1"${k?'':' disabled'}>↑</button><button class="btn" data-pe="itemMove" data-k="${k}" data-d="1"${k<items.length-1?'':' disabled'}>↓</button><button class="btn" data-pe="itemDel" data-k="${k}">✕</button></div>`).join('')}</div>
      <div class="bar"><input class="f" id="peNewItem" placeholder="Nouvel élément (ex. Groupe électrogène 20 kVA)" style="flex:1;max-width:none"><button class="btn pri" data-pe="itemAdd">+ Ajouter</button></div>`:''}
    ${imgs.length?`<div class="small muted" style="margin-top:8px">Images : ${imgs.map(esc).join(' · ')} (modifiables en mode texte)</div>`:''}
    ${commentsOf(L)}</div>
    <div class="card"><h3>Aperçu (écran de l’opérateur)</h3><div id="pePrev">${rStepPreview(pi,si)}</div></div>`;
}
function rStepPreview(pi,si){
  const ph=(PROC.parsed.phases||[])[pi], st=ph&&ph.steps[si]; if(!st) return '<div class="muted">—</div>';
  const C={'sécurité':['bad','⛑ Sécurité'],'machine':['warn','⚙ Machine'],'qualité':['','◎ Qualité']}[st.crit];
  return `<div style="border:1px solid var(--line);border-radius:12px;padding:12px;${st.crit==='sécurité'?'border-left:5px solid var(--bad)':''}">
    <span class="tag">${esc(st.type)}</span>${C?` <span class="tag ${C[0]}">${C[1]}</span>`:''}<h3 style="margin:8px 0">${inl(st.title)}</h3>
    ${st.text.map(x=>`<p style="margin:6px 0">${inl(x)}</p>`).join('')}${st.notes.map(n=>`<div class="note warn small">${inl(n)}</div>`).join('')}
    ${st.plage?`<div class="note small">Plage : <b>${esc(plageTxt(st.plage))}</b></div>`:''}${st.siNon?`<div class="note warn small">Si non : ${inl(st.siNon)}</div>`:''}
    ${st.items.map(x=>`<div class="small">☐ ${inl(x)}</div>`).join('')}${st.type==='minuterie'&&st.dureeTxt?`<div class="note small">Durée : <b>${esc(st.dureeTxt)}</b>${st.repeat?' – alerte périodique':''}</div>`:''}</div>`;
}
function rePrev(){ const s=PROC.sel, el=$('#pePrev'); if(el&&s&&s.s!=null) el.innerHTML=rStepPreview(s.p,s.s); }

/* ---------- édition ---------- */
const curBlock=()=>{ const s=PROC.sel; if(!s) return null; const p=PROC.model.phases[s.p]; return s.s==null?{p,lines:p.body,name:'Phase '+phaseName(p)}:{p,s:p.steps[s.s],lines:p.steps[s.s].lines,name:stepName(p.steps[s.s])}; };
const lines2=v=>String(v).split('\n').map(x=>x.trim()).filter(Boolean);
function peField(id,val){
  const b=curBlock(); if(!b) return; const L=b.lines;
  switch(id){
    case 'pname': b.p.title=`# Phase : ${val.trim()||'Sans nom'}`; break;
    case 'stitle': b.s.title=`## ${val.trim()||'Sans titre'}`; break;
    case 'texts': setTexts(L,lines2(val)); break;
    case 'notes': setNotes(L,lines2(val)); break;
    case 'sinon': setKey(L,'si non',val); break;
    case 'sihors': setKey(L,'si hors plage',val); break;
    default: setKey(L,id,val);
  }
  procCommit('Modifié : '+(b.s?stepName(b.s):'phase '+phaseName(b.p)));
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='peRaw'){ PROC.text=t.value; PROC.model=mdModel(PROC.text); procParse(); if(!PROC.changes.includes('Modifié en mode texte')) PROC.changes.push('Modifié en mode texte');
    LS.set('procDraft',procDirty()?{text:PROC.text,base:PROC.src,changes:PROC.changes}:null); clearTimeout(PROC._t); PROC._t=setTimeout(()=>{ const pos=t.selectionStart, sc=t.scrollTop; render(); const n=$('#peRaw'); if(n){ n.focus(); n.setSelectionRange(pos,pos); n.scrollTop=sc; } },900); return; }
  if(t.dataset.pf&&t.tagName!=='SELECT'){ peField(t.dataset.pf,t.value); rePrev(); if(['stitle','pname','debut','fin'].includes(t.dataset.pf)){ const ae=document.activeElement, pf=ae&&ae.dataset.pf, pos=ae&&ae.selectionStart; render(); const n=pf&&document.querySelector(`[data-pf="${pf}"]`); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} } } return; }
  if(t.dataset.item!=null){ if(!t.value.trim()) return; const b=curBlock(), it=getItems(b.lines); it[+t.dataset.item]=t.value.trim(); setItems(b.lines,it); procCommit('Modifié : '+b.name); rePrev(); }
});
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset.pf&&t.tagName==='SELECT'){ peField(t.dataset.pf,t.value); render(); } });
document.addEventListener('keydown',e=>{ if(e.target.id==='peNewItem'&&e.key==='Enter'){ e.preventDefault(); document.querySelector('[data-pe="itemAdd"]')?.click(); } });
function nextBlank(arr){ if(arr.length&&arr[arr.length-1].trim()) arr.push(''); }
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-pe]'); if(!b) return; const a=b.dataset.pe, M=PROC.model, s=PROC.sel;
  switch(a){
    case 'mode': PROC.mode=b.dataset.v; LS.set('peMode',PROC.mode); render(); return;
    case 'reload': if(procDirty()&&!confirm('Recharger depuis GitHub ? Les modifications non publiées restent dans le brouillon.')) return; PROC.loaded=false; await procLoad(false); return;
    case 'discard': if(!confirm('Abandonner toutes les modifications non publiées ?')) return; LS.set('procDraft',null); PROC.text=PROC.src; PROC.changes=[]; PROC.model=mdModel(PROC.text); procParse(); render(); return;
    case 'restoreOld': PROC.text=PROC.oldDraft.text; PROC.changes=PROC.oldDraft.changes||[]; PROC.oldDraft=null; PROC.model=mdModel(PROC.text); procParse(); procCommit(); render(); return;
    case 'sel': PROC.sel={p:+b.dataset.p,s:b.dataset.s!=null?+b.dataset.s:null}; render(); return;
    case 'addPhase': case 'addPhaseAfter': { const at=a==='addPhase'?M.phases.length:s.p+1, prev=M.phases[at-1];
      if(prev) nextBlank(prev.steps.length?prev.steps[prev.steps.length-1].lines:prev.body);
      const lv=Math.max(1,...(PROC.parsed.tasks||[]).map(t=>t.fin))+ (a==='addPhase'?1:0);
      M.phases.splice(at,0,{title:'# Phase : Nouvelle phase',body:[`Début: ${a==='addPhase'?lv:getKey(M.phases[s.p].body,'fin')||lv}`,`Fin: ${a==='addPhase'?lv:getKey(M.phases[s.p].body,'fin')||lv}`,''],steps:[{title:'## Nouvelle étape',lines:['Type: action','','']}]});
      PROC.sel={p:at,s:null}; procCommit('Ajout : phase'); render(); return; }
    case 'delPhase': if(!confirm(`Supprimer la phase « ${phaseName(M.phases[s.p])} » et ses ${M.phases[s.p].steps.length} étape(s) ?`)) return;
      PROC.changes.push('Supprimé : phase '+phaseName(M.phases[s.p])); M.phases.splice(s.p,1); PROC.sel=null; procCommit(); render(); return;
    case 'movePhase': { const d=+b.dataset.d, j=s.p+d; [M.phases[s.p],M.phases[j]]=[M.phases[j],M.phases[s.p]];
      M.phases.forEach(p=>nextBlank(p.steps.length?p.steps[p.steps.length-1].lines:p.body)); PROC.sel={p:j,s:null}; procCommit('Déplacé : phase '+phaseName(M.phases[j])); render(); return; }
    case 'addStep': { const p=M.phases[s.p], at=b.dataset.at==='start'?0:s.s+1, prev=at?p.steps[at-1].lines:p.body; nextBlank(prev);
      p.steps.splice(at,0,{title:'## Nouvelle étape',lines:['Type: action','']}); PROC.sel={p:s.p,s:at}; procCommit('Ajout : étape dans '+phaseName(p)); render(); return; }
    case 'dupStep': { const p=M.phases[s.p], o=p.steps[s.s]; nextBlank(o.lines); p.steps.splice(s.s+1,0,{title:o.title+' (copie)',lines:[...o.lines]}); PROC.sel={p:s.p,s:s.s+1}; procCommit('Ajout : copie de '+stepName(o)); render(); return; }
    case 'delStep': { const p=M.phases[s.p]; if(!confirm(`Supprimer l’étape « ${stepName(p.steps[s.s])} » ?`)) return; PROC.changes.push('Supprimé : '+stepName(p.steps[s.s]));
      p.steps.splice(s.s,1); PROC.sel=p.steps.length?{p:s.p,s:Math.max(0,s.s-1)}:{p:s.p,s:null}; procCommit(); render(); return; }
    case 'moveStep': { const p=M.phases[s.p], d=+b.dataset.d, j=s.s+d; [p.steps[s.s],p.steps[j]]=[p.steps[j],p.steps[s.s]]; p.steps.forEach(x=>nextBlank(x.lines)); PROC.sel={p:s.p,s:j}; procCommit('Déplacé : '+stepName(p.steps[j])); render(); return; }
    case 'itemAdd': { const v=($('#peNewItem').value||'').trim(); if(!v) return; const bl=curBlock(); const it=getItems(bl.lines); it.push(v); setItems(bl.lines,it); procCommit('Modifié : '+bl.name); render(); $('#peNewItem')?.focus(); return; }
    case 'itemDel': { const bl=curBlock(), it=getItems(bl.lines); it.splice(+b.dataset.k,1); setItems(bl.lines,it); procCommit('Modifié : '+bl.name); render(); return; }
    case 'itemMove': { const bl=curBlock(), it=getItems(bl.lines), k=+b.dataset.k, j=k+(+b.dataset.d); [it[k],it[j]]=[it[j],it[k]]; setItems(bl.lines,it); procCommit('Modifié : '+bl.name); render(); return; }
    case 'publish': return pePublishForm();
    case 'doPublish': return pePublish();
  }
});
window.__pe={mdText,mdModel,get PROC(){return PROC;}};   // accès pour les essais
function bumpVersion(v){ const m=String(v||'0').match(/^(.*?)(\d+)$/); return m?m[1]+(+m[2]+1):(v||'0')+'.1'; }
function pePublishForm(){
  const o=$('#pePub'); const err=(PROC.parsed.warnings||[]).filter(w=>/illisible|inconnu|avant toute phase|Aucune étape|Fin < Début/i.test(w.msg));
  if(!procTok()){ o.innerHTML='<div class="note bad">Pour publier, renseigner dans <b>Réglages</b> un jeton GitHub avec accès en écriture au dépôt <b>J3D-Procedures</b>.</div>'; return; }
  if(err.length){ o.innerHTML=`<div class="note bad">Publication bloquée : ${err.length} erreur(s) de format à corriger (voir la liste ci-dessus).</div>`; return; }
  const v=PROC.parsed.meta.version, nv=bumpVersion(v);
  o.innerHTML=`<div class="note"><b>Publier la version ${esc(nv)}</b> (actuelle : ${esc(v||'?')}). Les nouveaux chantiers l’utiliseront ; les chantiers en cours gardent leur version.
    <label class="f">Message (historique GitHub)</label><textarea class="f" id="peMsg" rows="3" style="width:100%;max-width:none">${esc(`Procédure v${nv} – `+(PROC.changes.slice(0,8).join(' ; ')||'mise à jour')+(PROC.changes.length>8?' ; …':''))}</textarea>
    <div class="bar"><button class="btn pri" data-pe="doPublish">Confirmer la publication</button></div></div>`;
}
async function pePublish(){
  const o=$('#pePub'), msg=($('#peMsg').value||'').trim()||'Mise à jour de la procédure';
  o.innerHTML='<div class="note">Publication…</div>';
  try{
    const cur=await ghProc(`contents/${PROC_PATH}?ref=main&t=${Date.now()}`);
    if(b64dec(cur.content)!==PROC.src){ o.innerHTML='<div class="note bad">La procédure a été modifiée en ligne depuis le chargement. Recharger, puis refaire les modifications (le brouillon reste disponible).</div>'; return; }
    const today=new Date(), iso=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`, nv=bumpVersion(PROC.parsed.meta.version);
    let t=PROC.text.replace(/^(version:\s*).*$/m,`$1${nv}`).replace(/^(date:\s*).*$/m,`$1${iso}`);
    const r=await ghProc(`contents/${PROC_PATH}`,{method:'PUT',body:JSON.stringify({message:msg,content:b64(t),sha:cur.sha,branch:'main'})});
    LS.set('procDraft',null); PROC.src=t; PROC.text=t; PROC.sha=r.content?.sha; PROC.changes=[]; PROC.model=mdModel(t); procParse(); render();
    toast(`Version ${nv} publiée – en ligne d’ici 1 à 2 minutes`,5000);
  }catch(e){ o.innerHTML=`<div class="note bad">${esc(e.message)}</div>`; }
}

/* ---------- Événements ---------- */
function readCfg(){ const v=id=>$(id)?.value?.trim();
  if($('#cRepo')) Object.assign(CFG,{repo:v('#cRepo').replace(/^https?:\/\/github\.com\//,'').replace(/\/+$/,''),branch:v('#cBranch')||'main',dir:(v('#cDir')||'').replace(/^\/+|\/+$/g,'')||'chantiers',token:v('#cTok'),procToken:v('#cProcTok'),admin:v('#cAdm')});
  if($('#cDbxKey')) Object.assign(CFG,{dbxKey:v('#cDbxKey'),dbxDir:(v('#cDbxDir')||'').replace(/^\/+|\/+$/g,'')||'chantiers',useDbx:$('#cUseDbx').checked,useGh:$('#cUseGh').checked}); }
async function collect(list){
  const pr=$('#prog'); let ok=0;
  for(const c of list){ pr.textContent=`Envoi de « ${c.name} »…`; try{ await pushChantier(c); ok++; }catch(e){ pr.innerHTML=`<span style="color:var(--bad)">${esc(c.name)} : ${esc(e.message)}</span>`; render(); return; } }
  render(); toast(`${ok} journal${ok>1?'aux':''} déposé${ok>1?'s':''} : ${destTxt()}`);
}
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('button,[data-incl]'); if(!b) return;
  if(b.dataset.view){ view=b.dataset.view; render(); return; }
  if(b.dataset.afilter){ LS.set('afilter',b.dataset.afilter); render(); return; }
  if(b.dataset.dl){ const c=CH.find(x=>x.id===b.dataset.dl); download(fileBase(c)+'.csv',csvOf(c)); return; }
  if(b.dataset.push){ const c=CH.find(x=>x.id===b.dataset.push); b.disabled=true; b.textContent='Envoi…';
    try{ const p=await pushChantier(c); toast(`Déposé : ${p}`,4000); }catch(e){ toast(e.message,6000); } render(); return; }
  if(b.dataset.mdone){ const cur=compteur(), vin=parseFloat(($('#mH')?.value||'').replace(',','.')); const d={lastH:!isNaN(vin)?vin:(cur?cur.h:null),lastAt:Date.now(),by:CFG.admin||'admin'};
    try{ await saveMnt(b.dataset.mdone,d); toast('Maintenance enregistrée'); }catch(e){ toast('Échec : '+e.message,5000); } render(); return; }
  switch(b.dataset.act){
    case 'setCompteur': { const v=parseFloat(($('#mH').value||'').replace(',','.')); if(isNaN(v)||v<0){ toast('Saisir un nombre d’heures'); return; }
      try{ await saveMnt('_compteur',{h:v,at:Date.now(),by:CFG.admin||'admin'}); toast('Compteur enregistré'); }catch(e){ toast('Échec : '+e.message,5000); } render(); return; }
    case 'collect': b.disabled=true; await collect(CH.filter(c=>c.closedAt&&!isCollected(c))); return;
    case 'restale': b.disabled=true; await collect(CH.filter(c=>c.collected&&(c.log||[]).length>c.collected.logCount)); return;
    case 'reload': await refresh(); toast('Données actualisées'); return;
    case 'inclAll': INCL=CH.map(c=>c.id); LS.set('incl',INCL); render(); return;
    case 'inclClosed': INCL=null; LS.set('incl',null); render(); return;
    case 'saveCfg': readCfg(); LS.set('cfg',CFG); toast('Réglages enregistrés'); render(); return;
    case 'dbxConnect': readCfg(); LS.set('cfg',CFG); try{ await dbxConnect(); }catch(e){ toast(e.message,5000); } return;
    case 'dbxForget': CFG.dbxRefresh=''; DBXTOK=null; LS.set('cfg',CFG); toast('Dropbox déconnecté de ce navigateur'); render(); return;
    case 'dbxTest': { const o=$('#dbxRes'); o.innerHTML='<div class="note">Test…</div>';
      try{ const r=await dbxRpc('files/list_folder',{path:''}); if(r.__conflict) throw new Error(r.__conflict.error_summary||'erreur');
        o.innerHTML=`<div class="note ok">Dropbox accessible ✓ – ${r.entries.length} élément(s) à la racine du dossier de l’application.</div>`; }
      catch(e){ o.innerHTML=`<div class="note bad">${esc(e.message)}</div>`; } return; }
    case 'forget': CFG.token=''; LS.set('cfg',CFG); toast('Jeton effacé de ce navigateur'); render(); return;
    case 'testGh': { const o=$('#ghRes'); o.innerHTML='<div class="note">Test…</div>';
      try{ const r=await gh(''); if(!r) throw new Error('Dépôt introuvable ou jeton sans accès à ce dépôt');
        const w=r.permissions?.push; o.innerHTML=`<div class="note ${w?'ok':'warn'}">Dépôt <b>${esc(r.full_name)}</b> ${r.private?'(privé)':'<b>(PUBLIC – déconseillé)</b>'} · écriture ${w?'autorisée ✓':'NON autorisée : donner « Contents : Read and write » au jeton'}</div>`; }
      catch(e){ o.innerHTML=`<div class="note bad">${esc(e.message)}</div>`; } return; }
    case 'exportSynth': { const S=synth(), q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
      const L=[['Phase','Étape','Statut','Note','Anomalies','Commentaires','Dernière occurrence','Détail'].map(q).join(';')];
      S.groups.forEach(g=>{ const a=actionOf(g); L.push([g.phase,g.title,a.status,a.note,g.anoms.length,g.comments.length,g.last?fmtD(g.last):'',
        [...g.anoms.map(o=>`${o.c.name} ${fmtD(o.e.t)} ${o.kind}${o.e.value?` (${o.e.value} ${o.e.unit||''})`:''}${o.e.comment&&!AUTO_COMMENTS.has(o.e.comment)?` : ${o.e.comment}`:''}`),...g.comments.filter(o=>o.e.status!=='forcé').map(o=>`${o.c.name} ${fmtD(o.e.t)} : ${o.e.comment}`)].join(' | ')].map(q).join(';')); });
      download(`synthese_J3D_${isoD(Date.now())}.csv`,'﻿'+L.join('\r\n')); return; }
  }
});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.dataset.incl){ const s=new Set(inclIds()); t.checked?s.add(t.dataset.incl):s.delete(t.dataset.incl); INCL=[...s]; LS.set('incl',INCL); render(); return; }
  const box=t.closest('[data-aid]'); if(box&&t.dataset.k){
    const g=synth().groups.find(x=>x.id===box.dataset.aid)||ACT[box.dataset.aid]; const a={...actionOf(g),key:g.key,phase:g.phase,title:g.title};
    a[t.dataset.k]=t.value; a.updatedAt=Date.now(); a.updatedBy=CFG.admin||'admin';
    try{ await saveAction(a); toast('Suivi enregistré'); }catch(e){ toast('Échec : '+e.message,5000); }
    if(t.dataset.k==='status') render(); else nav();
  }
});

  try{ await dbxCallback().catch(e=>toast('Dropbox : '+e.message,6000)); await connect(); await loadAll(); $('#st').textContent=DB.mock?'Maquette':'Firebase ✓'; render(); }
